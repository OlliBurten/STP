<style>

          })}

// ─── Hero metrics (with sparkline) ─────────────────────────────────────────
function Metric({ label, value, delta, trend, sparkline, color="#F5A623" }) {
  const positive = delta && delta.startsWith("+");
  const data = sparkline || [12,14,11,16,13,18,15,22,19,24,21,27];
  const max = Math.max(...data), min = Math.min(...data);
  const w = 100, h = 28;
  const pts = data.map((d,i) => `${(i/(data.length-1))*w},${h - ((d-min)/(max-min || 1))*h}`).join(" ");
  return (
    <div style={{ padding:"16px 18px", background:"#0a1414", border:"1px solid rgba(255,255,255,0.05)", borderRadius:12 }}>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:14 }}>
        <div style={{ fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.5)", letterSpacing:0.3 }}>{label}</div>
        {delta && (
          <div style={{ display:"flex", alignItems:"center", gap:3, padding:"2px 7px", borderRadius:5, background: positive ? "rgba(74,222,128,0.08)" : "rgba(248,113,113,0.08)", border: `1px solid ${positive ? "rgba(74,222,128,0.18)" : "rgba(248,113,113,0.18)"}`, fontSize:10, fontWeight:700, color: positive ? "#4ade80" : "#f87171" }} className="mono">
            <Icon n={positive ? "up" : "down"} s={9}/>{delta}
          </div>
        )}
      </div>
      <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", gap:14 }}>
        <div>
          <div style={{ fontSize:28, fontWeight:800, letterSpacing:-1, lineHeight:1, color:"#fff" }} className="mono">{value}</div>
          {trend && <div style={{ fontSize:10.5, color:"rgba(255,255,255,0.4)", marginTop:4 }}>{trend}</div>}
        </div>
        <svg viewBox={`0 0 ${w} ${h}`} style={{ width:90, height:28 }} preserveAspectRatio="none">
          <defs>
            <linearGradient id={`g-${label}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
              <stop offset="100%" stopColor={color} stopOpacity="0"/>
            </linearGradient>
          </defs>
          <polyline points={pts} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          <polyline points={`0,${h} ${pts} ${w},${h}`} fill={`url(#g-${label})`} stroke="none"/>
        </svg>
      </div>
    </div>
  );
}

// ─── Main ─────────────────────────────────────────────────────────────────
function App() {
  const [t, setT] = React.useState(TWEAK_DEFAULTS);
  const setSection = (v) => { setT(p => ({...p, section:v})); window.parent.postMessage({type:"__edit_mode_set_keys", edits:{section:v}}, "*"); };
  const setCmdK = (v) => { setT(p => ({...p, cmdK:v})); window.parent.postMessage({type:"__edit_mode_set_keys", edits:{cmdK:v}}, "*"); };

  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); setCmdK(true); }
      if (e.key === "Escape") setCmdK(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <div style={{ display:"flex", height:"100vh" }}>
      <Sidebar section={t.section} onChange={setSection}/>
      <div style={{ flex:1, display:"flex", flexDirection:"column", minWidth:0 }}>
        <TopBar openCmd={()=>setCmdK(true)}/>
        <main style={{ flex:1, overflowY:"auto" }}>
          {t.section === "overview" && <Overview/>}
          {t.section !== "overview" && <Placeholder title={NAV_GROUPS.flatMap(g=>g.items).find(i=>i.id===t.section)?.l || "Sektion"} desc="Använder samma shell. Specifik design kommer i nästa pass."/>}
        </main>
      </div>
      <CmdK open={t.cmdK} onClose={()=>setCmdK(false)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
