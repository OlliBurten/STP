function Sidebar({ section, onChange }) {

        <div>
          <div style={{ fontSize:13, fontWeight:800, letterSpacing:-0.2, lineHeight:1.2 }}>Admin</div>
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.4)", marginTop:1 }}>v2.4.1 · prod</div>
        </div>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:"12px 8px" }}>
        {NAV_GROUPS.map((g, gi) => (
          <div key={g.l} style={{ marginBottom: gi < NAV_GROUPS.length-1 ? 18 : 0 }}>
            <div style={{ padding:"6px 10px 8px", fontSize:9.5, fontWeight:800, letterSpacing:1.5, textTransform:"uppercase", color:"rgba(255,255,255,0.3)" }}>{g.l}</div>
            {g.items.map(it => {
              const on = section === it.id;
              return (
                <button key={it.id} onClick={()=>onChange(it.id)} style={{ width:"100%", padding:"8px 10px", borderRadius:8, background: on ? "rgba(245,166,35,0.1)" : "transparent", border:"none", cursor:"pointer", display:"flex", alignItems:"center", gap:11, color: on ? "#F5A623" : "rgba(255,255,255,0.7)", fontSize:13, fontWeight: on ? 700 : 500, textAlign:"left", marginBottom:2 }}>

                  <span style={{ flex:1 }}>{it.l}</span>

// ─── Main app ─────────────────────────────────────────────────────────────
function App() {
  const [t, setT] = React.useState(TWEAK_DEFAULTS);
  const [selected, setSelected] = React.useState(new Set());
  const [filter, setFilter] = React.useState("all");

  const setSection = (v) => { setT(p => ({...p, section:v})); window.parent.postMessage({type:"__edit_mode_set_keys", edits:{section:v}}, "*"); };
  const setSelectedId = (id) => { setT(p => ({...p, selectedId:id})); window.parent.postMessage({type:"__edit_mode_set_keys", edits:{selectedId:id}}, "*"); };

  const toggle = (id) => {
    const next = new Set(selected);
    if (next.has(id)) next.delete(id); else next.add(id);
    setSelected(next);
  };

  const filtered = USERS.filter(u => {
    if (filter === "driver") return u.role === "DRIVER";
    if (filter === "company") return u.role === "COMPANY";
    if (filter === "unverified") return !u.verified;
    if (filter === "stuck") return u.stuck;
    if (filter === "warnings") return u.warnings > 0;
    if (filter === "suspended") return u.suspended;
    return true;
  });

  const allSelected = filtered.length > 0 && filtered.every(u => selected.has(u.id));
  const toggleAll = () => {
    if (allSelected) {
      const next = new Set(selected);
      filtered.forEach(u => next.delete(u.id));
      setSelected(next);
    } else {
      const next = new Set(selected);
      filtered.forEach(u => next.add(u.id));
      setSelected(next);
    }
  };

  const selectedUser = USERS.find(u => u.id === t.selectedId);

  return (
    <div style={{ display:"flex", height:"100vh" }}>
      <Sidebar section={t.section} onChange={setSection}/>
      <div style={{ flex:1, display:"flex", flexDirection:"column", minWidth:0 }}>
        <TopBar/>
        <main style={{ flex:1, display:"flex", minHeight:0 }}>
          <div style={{ flex:1, overflowY:"auto", minWidth:0 }}>
            <UsersHeader selected={selected} filter={filter} setFilter={setFilter}/>
            <BulkBar count={selected.size} onClear={()=>setSelected(new Set())}/>
            <TableHeader allSelected={allSelected} onSelectAll={toggleAll} compact={!!selectedUser}/>
            {filtered.map(u => (
              <UserRow key={u.id} u={u} selected={selected.has(u.id)} isSelectedRow={t.selectedId === u.id} onCheck={()=>toggle(u.id)} onSelect={()=>setSelectedId(u.id)} compact={!!selectedUser}/>
            ))}
            {filtered.length === 0 && (
              <div style={{ padding:"60px 20px", textAlign:"center", color:"rgba(255,255,255,0.5)" }}>Inga användare matchar filtret.</div>
            )}
          </div>
          <DetailPanel u={selectedUser} onClose={()=>setSelectedId(null)}/>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
