<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Åkeri Dashboard</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>

<style>
  /* Responsive grids */
  .dash-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .dash-main { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  .dash-pipeline { display: grid; grid-template-columns: repeat(7, auto); align-items: center; gap: 0; }

  @media (max-width: 1100px) {
    .dash-main { grid-template-columns: 1fr; }
  }
  @media (max-width: 880px) {
    .dash-kpis { grid-template-columns: repeat(2, 1fr); }
    .dash-pipeline { grid-template-columns: 1fr; }
    .dash-pipeline > .stp-chev { display: none; }
  }
  @media (max-width: 540px) {
    .dash-kpis { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ════════════════════════════════════════════════
   DATA
════════════════════════════════════════════════ */
const COMPANY = {
  name: "Nordic Transport AB",
  short: "Nordic Transport",
  initials: "NT",
  verified: true,
};

const KPIS = [
  { label: "Nya ansökningar",       value: 7,   delta: "+3 idag",          tone: "amber",   icon: "user" },
  { label: "Obesvarade meddelanden", value: 3,  delta: "Senaste 18 min",   tone: "danger",  icon: "msg" },
  { label: "Aktiva annonser",       value: 4,   delta: "av 5 publicerade", tone: "primary", icon: "building" },
  { label: "Profilvisningar",       value: 284, delta: "+24 % denna vecka", tone: "success", icon: "eye" },
];

const ACTIVITY = [
  { type: "message",     who: "Anna Lindberg",    action: "väntar på svar i", target: "Distribution Stockholm",  time: "18 min", bucket: "hour", urgent: true },
  { type: "application", who: "Erik Johansson",   action: "sökte",      target: "CE-chaufför fjärr",       time: "12 min", bucket: "hour", match: 94 },
  { type: "view",        who: "3 förare",         action: "visade",     target: "er företagsprofil",       time: "3 tim",  bucket: "today" },
  { type: "application", who: "Mikael Stenberg",  action: "sökte",      target: "CE-chaufför fjärr",       time: "4 tim",  bucket: "today", match: 78 },
  { type: "application", who: "Sara Pettersson",  action: "sökte",      target: "Distribution Stockholm",  time: "igår",   bucket: "earlier", match: 86 },
];

// Aggregate funnel across all open positions
const PIPELINE = [
  { stage: "Nya",        value: 30, sub: "+7 idag",     tone: "amber" },
  { stage: "Granskade",  value: 18, sub: "60 % av nya", tone: "primary" },
  { stage: "Kontaktade", value: 7,  sub: "39 % vidare", tone: "primary" },
  { stage: "Anställda",   value: 2,  sub: "denna månad", tone: "success" },
];

const ACTIVE_JOBS = [
  { title: "CE-chaufför fjärrkörning", loc: "Malmö",    applicants: 12, new: 3, views: 84, days: 6,  hot: true },
  { title: "Distributionschaufför",    loc: "Stockholm",applicants: 8,  new: 2, views: 51, days: 11, hot: false },
  { title: "Lokal CE-tjänst",          loc: "Göteborg", applicants: 4,  new: 0, views: 23, days: 18, hot: false, stagnant: true },
  { title: "Tankbilschaufför ADR",     loc: "Malmö",    applicants: 6,  new: 2, views: 38, days: 4,  hot: true },
];

const SUGGESTED = [
  { name: "Lars Eriksson",  initials: "LE", loc: "Lund",        exp: 8,  segments: ["Fjärr","ADR"],    match: 91 },
  { name: "Karin Olsson",   initials: "KO", loc: "Malmö",       exp: 14, segments: ["Fjärr"],           match: 88 },
  { name: "Johan Berg",     initials: "JB", loc: "Helsingborg", exp: 6,  segments: ["Distribution"],    match: 84 },
];

const PERFORMANCE = [42, 38, 51, 47, 58, 63, 71, 68, 74, 82, 79, 88];

const NAV_ITEMS = [
  { id: "oversikt",    label: "Översikt" },
  { id: "annonser",    label: "Annonser" },
  { id: "hitta",       label: "Hitta förare" },
  { id: "inkorg",      label: "Inkorg", badge: 3 },
  { id: "profil",      label: "Företagsprofil" },
];

/* ════════════════════════════════════════════════
   HERO GREETING
════════════════════════════════════════════════ */
const Hero = () => {
  const h = new Date().getHours();
  const greet = h < 5 ? "God natt" : h < 11 ? "God morgon" : h < 17 ? "God dag" : "God kväll";
  return (
    <section style={{
      maxWidth: 1240, margin: "0 auto",
      padding: "32px 32px 16px",
    }}>
      <div style={{
        display: "flex", alignItems: "flex-end", justifyContent: "space-between",
        gap: 24, flexWrap: "wrap", marginBottom: 4,
      }}>
        <div>
          <p style={{
            fontSize: 11, fontWeight: 800,
            color: "var(--ink-500)", letterSpacing: 1.4,
            textTransform: "uppercase", marginBottom: 10,
          }}>{greet}, {COMPANY.short}</p>
          <h1 style={{
            fontSize: 36, fontWeight: 800, letterSpacing: -1, color: "var(--ink-900)",
            lineHeight: 1.15, textWrap: "balance", maxWidth: 720,
          }}>
            Du har <span style={{ color: "var(--amber-deep)" }}>7 nya kandidater</span> som väntar.
          </h1>
        </div>

        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          {COMPANY.verified ? (
            <Pill tone="success" icon={<Dot tone="success" size={6}/>}>Verifierat åkeri</Pill>
          ) : (
            <Pill tone="amber" icon={<Dot tone="amber" size={6}/>}>Verifiering pågår</Pill>
          )}
          <Button variant="secondary" icon={<Icon name="search" size={14} stroke={2}/>}>
            Hitta förare
          </Button>
          <Button variant="primary" icon={<Icon name="plus" size={14} stroke={2.4}/>}>
            Publicera annons
          </Button>
        </div>
      </div>
    </section>
  );
};

/* ════════════════════════════════════════════════
   KPI CARDS
════════════════════════════════════════════════ */
const KPICard = ({ k }) => {
  const tones = {
    amber:   { bg: "var(--amber-tint)",   color: "var(--amber-deep)" },
    danger:  { bg: "var(--danger-tint)",  color: "var(--danger)" },
    primary: { bg: "var(--green-tint)",   color: "var(--green-text)" },
    success: { bg: "var(--success-tint)", color: "var(--success)" },
  };
  const t = tones[k.tone];
  const deltaColor =
    k.tone === "danger" ? "var(--danger)" :
    k.tone === "success" ? "var(--success)" :
    k.tone === "amber" ? "var(--amber-deep)" :
    "var(--ink-500)";
  return (
    <button style={{
      background: "var(--card)", border: "1px solid var(--line)",
      borderRadius: "var(--r-lg)", padding: "20px 22px",
      boxShadow: "var(--sh-sm)",
      display: "flex", flexDirection: "column", alignItems: "stretch",
      textAlign: "left", cursor: "pointer", width: "100%",
      transition: "transform .12s, box-shadow .15s",
    }}
    onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "var(--sh)"; }}
    onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "var(--sh-sm)"; }}
    >
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 16,
      }}>
        <span style={{
          width: 36, height: 36, borderRadius: 10,
          background: t.bg, color: t.color,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Icon name={k.icon} size={17} color={t.color} stroke={2}/>
        </span>
        <Icon name="chevRight" size={14} color="var(--ink-300)" stroke={2}/>
      </div>
      <div style={{
        fontSize: 32, fontWeight: 800, color: "var(--ink-900)",
        letterSpacing: -1, lineHeight: 1, marginBottom: 8,
        fontFamily: "var(--mono)",
      }}>{k.value}</div>
      <div style={{ fontSize: 13, color: "var(--ink-500)", marginBottom: 6, fontWeight: 500 }}>
        {k.label}
      </div>
      <div style={{ fontSize: 12, fontWeight: 700, color: deltaColor }}>
        {k.delta}
      </div>
    </button>
  );
};

const KPIRow = () => (
  <div style={{
    display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14,
    marginBottom: 20,
  }}>
    {KPIS.map(k => <KPICard key={k.label} k={k}/>)}
  </div>
);

/* ════════════════════════════════════════════════
   WAITING ALERT — the most urgent thing on the page
════════════════════════════════════════════════ */
const WaitingAlert = () => (
  <div style={{
    background: "var(--danger-tint)",
    border: "1px solid rgba(185,28,59,0.18)",
    borderRadius: "var(--r-lg)",
    padding: "16px 22px",
    display: "flex", alignItems: "center", gap: 16,
    marginBottom: 18,
    boxShadow: "var(--sh-sm)",
  }}>
    <span style={{
      width: 10, height: 10, borderRadius: 5,
      background: "var(--danger)",
      boxShadow: "0 0 0 4px rgba(185,28,59,0.16)",
      flexShrink: 0,
    }}/>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{
        fontSize: 15, fontWeight: 700, color: "var(--ink-900)",
        marginBottom: 2,
      }}>3 kandidater väntar på svar</div>
      <div style={{ fontSize: 13, color: "var(--ink-500)" }}>
        Snabbast: <strong style={{ color: "var(--ink-900)", fontWeight: 600 }}>Anna Lindberg</strong> · 18 minuter sedan
      </div>
    </div>
    <Button variant="primary" iconRight={<Icon name="arrow" size={14} stroke={2.2}/>}>
      Öppna inkorg
    </Button>
  </div>
);

/* ════════════════════════════════════════════════
   PIPELINE FUNNEL — replaces vanity profilvisningar chart
════════════════════════════════════════════════ */
const Pipeline = () => {
  const tones = {
    amber:   { color: "var(--amber-deep)", bar: "var(--amber)" },
    primary: { color: "var(--green)",      bar: "var(--green)" },
    success: { color: "var(--success)",    bar: "var(--success)" },
  };
  const max = Math.max(...PIPELINE.map(p => p.value));
  return (
    <Card>
      <SectionLabel
        accessory={
          <a href="#" style={{ fontSize: 13, fontWeight: 700, color: "var(--green)" }}>
            Per annons →
          </a>
        }
      >Rekryteringspipeline — denna månad, alla annonser</SectionLabel>

      <div className="dash-pipeline">
        {PIPELINE.map((p, i) => {
          const t = tones[p.tone];
          return (
            <React.Fragment key={p.stage}>
              <div style={{
                padding: "12px 18px",
                background: "var(--card-2)",
                borderRadius: "var(--r-md)",
                border: "1px solid var(--line)",
                minWidth: 130,
              }}>
                <div style={{
                  fontSize: 11, fontWeight: 800, color: "var(--ink-500)",
                  letterSpacing: 1.2, textTransform: "uppercase",
                  marginBottom: 6,
                }}>{p.stage}</div>
                <div style={{
                  fontSize: 32, fontWeight: 800, color: t.color,
                  letterSpacing: -0.8, lineHeight: 1,
                  marginBottom: 8,
                  fontFamily: "var(--mono)",
                }}>{p.value}</div>
                <div style={{
                  height: 3, borderRadius: 2,
                  background: "var(--paper-2)",
                  overflow: "hidden",
                  marginBottom: 7,
                }}>
                  <div style={{
                    height: "100%", width: `${(p.value/max)*100}%`,
                    background: t.bar, borderRadius: 2,
                  }}/>
                </div>
                <div style={{
                  fontSize: 11.5, color: "var(--ink-500)", fontWeight: 600,
                }}>{p.sub}</div>
              </div>
              {i < PIPELINE.length - 1 && (
                <div className="stp-chev" style={{
                  display: "flex", alignItems: "center", justifyContent: "center",
                  padding: "0 6px",
                  color: "var(--ink-300)",
                }}>
                  <Icon name="chevRight" size={16} stroke={2}/>
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </Card>
  );
};

/* ════════════════════════════════════════════════
   ACTIVITY FEED — grouped by time bucket
════════════════════════════════════════════════ */
const ActivityRow = ({ a, last }) => (
  <div style={{
    display: "flex", alignItems: "center", gap: 14,
    padding: "14px 0",
    borderBottom: last ? "none" : "1px solid var(--line)",
  }}>
    <Avatar initials={a.who.split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase()} size={38}/>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 14, color: "var(--ink-900)", lineHeight: 1.4 }}>
        <strong style={{ fontWeight: 700 }}>{a.who}</strong>
        <span style={{ color: "var(--ink-500)" }}> {a.action} </span>
        <strong style={{ fontWeight: 700 }}>{a.target}</strong>
      </div>
      <div style={{
        display: "flex", alignItems: "center", gap: 8, marginTop: 3,
        fontSize: 12, color: "var(--ink-500)",
      }}>
        <span>{a.time} sedan</span>
        {a.match != null && (
          <>
            <span style={{ color: "var(--ink-300)" }}>·</span>
            <span style={{
              fontWeight: 700,
              color: a.match >= 85 ? "var(--success)" :
                     a.match >= 70 ? "var(--amber-deep)" : "var(--ink-500)",
              fontFamily: "var(--mono)",
            }}>{a.match} % match</span>
          </>
        )}
      </div>
    </div>
    {a.type === "application" && (
      <Button variant="secondary" size="sm">Granska</Button>
    )}
    {a.type === "message" && (
      <Button variant="primary" size="sm">Svara</Button>
    )}
  </div>
);

const BucketLabel = ({ children, accent }) => (
  <div style={{
    display: "flex", alignItems: "center", gap: 10,
    paddingTop: 10, paddingBottom: 6,
  }}>
    <span style={{
      fontSize: 11, fontWeight: 800,
      color: accent ? "var(--danger)" : "var(--ink-500)",
      letterSpacing: 1.3, textTransform: "uppercase",
    }}>{children}</span>
    {accent && <span style={{
      width: 6, height: 6, borderRadius: 3, background: "var(--danger)",
    }}/>}
  </div>
);

const Activity = () => {
  const groups = [
    { label: "Senaste timmen",  accent: true,  items: ACTIVITY.filter(a => a.bucket === "hour") },
    { label: "Tidigare idag",   accent: false, items: ACTIVITY.filter(a => a.bucket === "today") },
    { label: "Tidigare",        accent: false, items: ACTIVITY.filter(a => a.bucket === "earlier") },
  ].filter(g => g.items.length > 0);
  return (
    <Card>
      <SectionLabel
        accessory={<a href="#" style={{ fontSize: 13, fontWeight: 700, color: "var(--green)" }}>Se all aktivitet →</a>}
      >Senaste aktivitet</SectionLabel>
      {groups.map(g => (
        <div key={g.label}>
          <BucketLabel accent={g.accent}>{g.label}</BucketLabel>
          {g.items.map((a, i) => (
            <ActivityRow key={`${a.who}-${a.time}`} a={a} last={i === g.items.length - 1}/>
          ))}
        </div>
      ))}
    </Card>
  );
};

/* ════════════════════════════════════════════════
   PERFORMANCE CHART
════════════════════════════════════════════════ */
const Performance = () => {
  const max = Math.max(...PERFORMANCE);
  return (
    <Card>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "flex-start",
        marginBottom: 22,
      }}>
        <div>
          <h3 style={{
            fontSize: 15, fontWeight: 800, color: "var(--ink-900)",
            letterSpacing: -0.3, marginBottom: 4,
          }}>Profilvisningar — senaste 12 veckorna</h3>
          <p style={{ fontSize: 13, color: "var(--ink-500)" }}>
            Trend uppåt — fler förare hittar er via Åkeri-sök.
          </p>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{
            fontSize: 24, fontWeight: 800, color: "var(--success)",
            letterSpacing: -0.5, fontFamily: "var(--mono)", lineHeight: 1,
          }}>+109 %</div>
          <div style={{ fontSize: 11, color: "var(--ink-500)", marginTop: 4, fontWeight: 600 }}>
            vs förra kvartalet
          </div>
        </div>
      </div>

      {/* Bars */}
      <div style={{
        display: "grid", gridTemplateColumns: `repeat(${PERFORMANCE.length}, 1fr)`,
        gap: 8, height: 140, alignItems: "end", marginBottom: 14,
      }}>
        {PERFORMANCE.map((v, i) => {
          const h = (v / max) * 100;
          const isLatest = i === PERFORMANCE.length - 1;
          return (
            <div key={i} style={{
              position: "relative", height: "100%",
              display: "flex", flexDirection: "column", justifyContent: "flex-end",
            }}>
              <div style={{
                width: "100%", height: `${h}%`,
                background: isLatest ? "var(--green)" : "var(--green-tint-2)",
                borderRadius: "5px 5px 0 0",
                transition: "background .15s",
              }}/>
              {isLatest && (
                <div style={{
                  position: "absolute", top: -22, left: "50%",
                  transform: "translateX(-50%)",
                  fontSize: 11, fontWeight: 800, color: "var(--green)",
                  fontFamily: "var(--mono)", whiteSpace: "nowrap",
                }}>{v}</div>
              )}
            </div>
          );
        })}
      </div>

      {/* X axis labels */}
      <div style={{
        display: "grid", gridTemplateColumns: `repeat(${PERFORMANCE.length}, 1fr)`,
        gap: 8, fontSize: 10.5, color: "var(--ink-400)",
        textAlign: "center", letterSpacing: 0.3, fontWeight: 600,
      }}>
        {["v.18","v.19","v.20","v.21","v.22","v.23","v.24","v.25","v.26","v.27","v.28","v.29"].map(w => (
          <span key={w}>{w}</span>
        ))}
      </div>
    </Card>
  );
};

/* ════════════════════════════════════════════════
   ACTIVE JOBS LIST
════════════════════════════════════════════════ */
const ActiveJobs = () => (
  <Card>
    <SectionLabel
      accessory={<a href="#" style={{ fontSize: 13, fontWeight: 700, color: "var(--green)" }}>Se alla →</a>}
    >Era annonser</SectionLabel>
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {ACTIVE_JOBS.map(j => (
        <a key={j.title} href="#" style={{
          display: "block",
          padding: "14px 16px",
          background: j.stagnant ? "var(--amber-tint)" : "var(--card-2)",
          border: `1px solid ${j.stagnant ? "rgba(199,122,14,0.22)" : "var(--line)"}`,
          borderRadius: 11,
          color: "inherit",
          transition: "background .15s, border-color .15s",
        }}
        onMouseEnter={e => {
          e.currentTarget.style.background = j.stagnant ? "#fbe8c8" : "#ffffff";
          e.currentTarget.style.borderColor = j.stagnant ? "rgba(199,122,14,0.35)" : "var(--line-2)";
        }}
        onMouseLeave={e => {
          e.currentTarget.style.background = j.stagnant ? "var(--amber-tint)" : "var(--card-2)";
          e.currentTarget.style.borderColor = j.stagnant ? "rgba(199,122,14,0.22)" : "var(--line)";
        }}
        >
          <div style={{
            display: "flex", justifyContent: "space-between",
            alignItems: "flex-start", gap: 8, marginBottom: 6,
          }}>
            <div style={{
              fontSize: 14, fontWeight: 700, lineHeight: 1.3,
              color: "var(--ink-900)", flex: 1,
            }}>{j.title}</div>
            {j.hot && <Pill tone="amberSolid" size="sm">HOT</Pill>}
            {j.stagnant && (
              <Pill tone="amber" size="sm" icon={<Icon name="alert" size={10} color="var(--amber-deep)" stroke={2.4}/>}>
                Behöver attention
              </Pill>
            )}
          </div>
          <div style={{
            fontSize: 12, color: "var(--ink-500)",
            display: "flex", alignItems: "center", gap: 6, marginBottom: 12,
          }}>
            <Icon name="pin" size={11} color="var(--ink-500)" stroke={1.8}/>
            {j.loc} · {j.days} dgr aktiv
          </div>
          <div style={{ display: "flex", gap: 18 }}>
            <Mini value={j.applicants} label="ansökningar" extra={j.new ? `+${j.new} nya` : null} extraColor="var(--amber-deep)" />
            <Mini value={j.views} label="visningar" />
          </div>
        </a>
      ))}
    </div>
  </Card>
);

const Mini = ({ value, label, extra, extraColor }) => (
  <div style={{ display: "flex", alignItems: "baseline", gap: 5 }}>
    <span style={{
      fontSize: 14, fontWeight: 800, color: "var(--ink-900)",
      fontFamily: "var(--mono)",
    }}>{value}</span>
    <span style={{ fontSize: 11.5, color: "var(--ink-500)" }}>{label}</span>
    {extra && (
      <span style={{
        fontSize: 11, fontWeight: 700, color: extraColor, marginLeft: 4,
      }}>{extra}</span>
    )}
  </div>
);

/* ════════════════════════════════════════════════
   SUGGESTED DRIVERS — bärnsten-accented
════════════════════════════════════════════════ */
const Suggested = () => (
  <Card>
    <div style={{
      display: "flex", alignItems: "center", gap: 9, marginBottom: 6,
    }}>
      <span style={{
        width: 28, height: 28, borderRadius: 7,
        background: "var(--amber)", color: "#fff",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Icon name="star" size={13} color="#fff" stroke={0}/>
      </span>
      <h3 style={{
        fontSize: 14.5, fontWeight: 800, color: "var(--ink-900)",

            <button style={{
