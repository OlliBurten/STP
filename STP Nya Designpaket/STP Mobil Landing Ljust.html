<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Sveriges Transportplattform (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const ROTATE = ["Förare.", "Åkeri.", "Match."];

const App = () => {
  const [idx, setIdx] = useState(0);
  const [vis, setVis] = useState(true);
  useEffect(() => {
    const id = setInterval(() => { setVis(false); setTimeout(() => { setIdx(i => (i+1)%ROTATE.length); setVis(true); }, 250); }, 2600);
    return () => clearInterval(id);
  }, []);

  return (
    <MobileShell noTabs statusDark statusBg="var(--ink-900)" contentBg="var(--paper)">
      <div>
        {/* Dark hero */}
        <div style={{ background:"var(--ink-900)", padding:"8px 24px 36px", position:"relative", overflow:"hidden" }}>
          {/* Top bar */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:36 }}>
            <div style={{ display:"flex", alignItems:"center", gap:9 }}><div style={{ width:28, height:28, borderRadius:7, background:"var(--green)", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, fontSize:12 }}>S</div><span style={{ fontWeight:800, fontSize:16, color:"#fff", letterSpacing:0.5 }}>STP</span></div>
            <button style={{ fontSize:13.5, color:"rgba(255,255,255,0.85)", fontWeight:600 }}>Logga in</button>
          </div>
          <div style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"6px 13px", borderRadius:999, background:"rgba(245,166,35,0.15)", border:"1px solid rgba(245,166,35,0.35)", color:"#f5c875", fontSize:11, fontWeight:700, letterSpacing:1.3, textTransform:"uppercase", marginBottom:26 }}><Dot tone="amber" size={5}/>Beta · Gratis</div>
          <h1 style={{ fontSize:44, fontWeight:900, lineHeight:1.02, letterSpacing:-2, color:"#fff", marginBottom:18 }}>
            Rätt<br/>
            <span style={{ color:"var(--amber)", opacity:vis?1:0, transform:vis?"translateY(0)":"translateY(6px)", display:"inline-block", transition:"opacity .25s, transform .25s" }}>{ROTATE[idx]}</span><br/>
            <span style={{ color:"rgba(255,255,255,0.35)", fontWeight:300 }}>Direkt.</span>
          </h1>
          <p style={{ fontSize:15.5, lineHeight:1.6, color:"rgba(255,255,255,0.78)", fontWeight:500, marginBottom:28 }}>Sveriges matchningsplattform för yrkesförare och transportföretag. Inga mellanhänder. Inga avgifter.</p>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            <button style={{ padding:"15px", borderRadius:12, background:"var(--amber)", color:"#fff", border:"1px solid var(--amber-deep)", fontWeight:700, fontSize:15.5, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>Se lediga jobb<Icon name="arrow" size={16} stroke={2.2}/></button>
            <button style={{ padding:"15px", borderRadius:12, background:"rgba(255,255,255,0.08)", color:"#fff", border:"1px solid rgba(255,255,255,0.22)", fontWeight:600, fontSize:15.5 }}>Jag är ett åkeri</button>
          </div>
        </div>

        {/* Stats */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:0, background:"var(--card)", borderBottom:"1px solid var(--line)" }}>
          {[["4 080","Lediga"],["36 %","Saknar förare"],["Gratis","För förare"]].map(([v,l],i) => (
            <div key={l} style={{ padding:"20px 8px", textAlign:"center", borderRight:i<2?"1px solid var(--line)":"none" }}>
              <div style={{ fontSize:20, fontWeight:800, color:i===2?"var(--green)":"var(--ink-900)", letterSpacing:-0.5, fontFamily:i<2?"var(--mono)":"var(--font)" }}>{v}</div>
              <div style={{ fontSize:10.5, color:"var(--ink-500)", marginTop:5, fontWeight:600, textTransform:"uppercase", letterSpacing:0.3 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* Value props */}
        <div style={{ padding:"28px 20px" }}>
          <h2 style={{ fontSize:22, fontWeight:900, color:"var(--ink-900)", letterSpacing:-0.8, marginBottom:18 }}>Så fungerar det</h2>
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            {[["search","Automatisk matchning","Matchas mot jobb baserat på körkort, region och vad du söker."],["eye","Synlig för åkerier","Du väljer om profilen är synlig — då kan åkerier hitta dig när de rekryterar."],["msg","Ansök direkt","Du ansöker direkt hos arbetsgivaren eller via STP — utan mellanhand."]].map(([ic,t,d]) => (
              <div key={t} style={{ display:"flex", gap:14, alignItems:"flex-start", background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
                <span style={{ width:42, height:42, borderRadius:11, background:"var(--green-tint)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name={ic} size={19} color="var(--green-text)" stroke={2}/></span>
                <div><div style={{ fontSize:15, fontWeight:700, color:"var(--ink-900)" }}>{t}</div><div style={{ fontSize:13, color:"var(--ink-500)", marginTop:3, lineHeight:1.5 }}>{d}</div></div>
              </div>
            ))}
          </div>
        </div>

        {/* CTA */}
        <div style={{ margin:"0 16px 28px", background:"var(--green)", borderRadius:18, padding:"28px 22px", textAlign:"center" }}>
          <h2 style={{ fontSize:22, fontWeight:900, color:"#fff", letterSpacing:-0.6, lineHeight:1.15, marginBottom:10 }}>Börja matcha rätt</h2>
          <p style={{ fontSize:14.5, color:"rgba(255,255,255,0.85)", lineHeight:1.5, marginBottom:20 }}>Skapa din profil på två minuter. Gratis under beta.</p>
          <button style={{ width:"100%", padding:"15px", borderRadius:12, background:"var(--amber)", color:"#fff", border:"1px solid var(--amber-deep)", fontWeight:700, fontSize:15.5, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>Skapa förarprofil<Icon name="arrow" size={16} stroke={2.2}/></button>
        </div>

        {/* Footer */}
        <div style={{ background:"var(--ink-900)", padding:"28px 24px", textAlign:"center" }}>
          <div style={{ display:"flex", alignItems:"center", gap:9, justifyContent:"center", marginBottom:12 }}><div style={{ width:26, height:26, borderRadius:7, background:"var(--green)", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, fontSize:11 }}>S</div><span style={{ fontWeight:800, fontSize:15, color:"#fff" }}>STP</span></div>
          <p style={{ fontSize:12, color:"rgba(255,255,255,0.5)", lineHeight:1.6 }}>Sveriges Transportplattform<br/>© 2026 · hej@transportplattformen.se</p>
        </div>
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
