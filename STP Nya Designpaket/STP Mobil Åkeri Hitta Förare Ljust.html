<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Hitta förare (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const DRIVERS = [
  { id:0, name:"Erik Johansson",  initials:"EJ", loc:"Malmö",       exp:8,  license:["CE"], certs:["YKB","ADR"], avail:"Söker aktivt", match:94, active:"Online" },
  { id:1, name:"Karin Olsson",    initials:"KO", loc:"Malmö",       exp:22, license:["CE"], certs:["YKB"],        avail:"Söker aktivt", match:91, active:"2h" },
  { id:2, name:"Anders Bergström",initials:"AB", loc:"Malmö",       exp:12, license:["CE"], certs:["YKB","ADR"], avail:"Söker aktivt", match:88, active:"4h" },
  { id:3, name:"Mikael Stenberg", initials:"MS", loc:"Lund",        exp:15, license:["CE"], certs:["ADR Tank"],   avail:"Öppen",        match:78, active:"Igår" },
];
const matchColor = (m) => m >= 90 ? "var(--success)" : m >= 75 ? "var(--green)" : "var(--amber-deep)";

const App = () => {
  const [tab, setTab] = useState("hitta");
  return (
    <MobileShell tabs={COMPANY_TABS} active={tab} onTab={setTab}
      header={<div style={{ background:"var(--paper)", padding:"6px 18px 14px" }}>
        <h1 style={{ fontSize:24, fontWeight:900, color:"var(--ink-900)", letterSpacing:-0.8, marginBottom:12 }}>Hitta förare</h1>
        <div style={{ position:"relative" }}>
          <span style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)", color:"var(--ink-400)" }}><Icon name="search" size={16} stroke={2}/></span>
          <input placeholder="Sök kompetens, ort..." style={{ width:"100%", padding:"11px 14px 11px 42px", background:"var(--card)", border:"1px solid var(--line-2)", borderRadius:12, fontSize:14, color:"var(--ink-900)", outline:"none", boxShadow:"var(--sh-sm)", fontFamily:"var(--font)" }}/>
        </div>
      </div>}>
      <div style={{ padding:"0 16px 24px" }}>
        <div style={{ display:"flex", gap:8, overflowX:"auto", paddingBottom:14 }}>
          {["Alla","CE","ADR","Skåne","Söker aktivt"].map((f, i) => <button key={f} style={{ flexShrink:0, padding:"7px 14px", borderRadius:999, fontSize:13, fontWeight:600, background:i===0?"var(--green)":"var(--card)", color:i===0?"#fff":"var(--ink-700)", border:`1px solid ${i===0?"var(--green-deep)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}>{f}</button>)}
        </div>
        <div style={{ fontSize:12.5, color:"var(--ink-500)", fontWeight:600, marginBottom:12 }}>{DRIVERS.length} förare matchar era annonser</div>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {DRIVERS.map(d => (
            <div key={d.id} style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:16, padding:16, boxShadow:"var(--sh-sm)" }}>
              <div style={{ display:"flex", gap:12, alignItems:"center", marginBottom:12 }}>
                <Avatar initials={d.initials} size={44}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:15, fontWeight:800, color:"var(--ink-900)" }}>{d.name}</div>
                  <div style={{ fontSize:12.5, color:"var(--ink-500)", marginTop:1 }}>{d.loc} · {d.exp} år</div>
                </div>
                <div style={{ textAlign:"right" }}><div style={{ fontSize:16, fontWeight:800, fontFamily:"var(--mono)", color:matchColor(d.match), lineHeight:1 }}>{d.match}%</div><div style={{ fontSize:10, color:"var(--ink-400)", fontWeight:700, letterSpacing:0.5, textTransform:"uppercase", marginTop:3 }}>match</div></div>
              </div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginBottom:12 }}>
                {d.license.map(l => <Pill key={l} tone="primary" size="sm">{l}</Pill>)}
                {d.certs.map(c => <Pill key={c} tone="neutral" size="sm">{c}</Pill>)}
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", paddingTop:12, borderTop:"1px solid var(--line)" }}>
                <span style={{ display:"inline-flex", alignItems:"center", gap:6, fontSize:12.5, fontWeight:600, color:"var(--ink-700)" }}><Dot tone="success" size={6}/>{d.avail} · {d.active}</span>
                <Button variant="primary" size="sm" icon={<Icon name="msg" size={13} stroke={2}/>}>Kontakta</Button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
