<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Hitta förare</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>
<script src="stp-sweden-geo.js"></script>
<script type="text/babel" src="stp-sweden-map.jsx"></script>

<style>
  .find-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
  @media (max-width: 1080px) { .find-grid { grid-template-columns: 1fr; } }
  .driver-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 720px) { .driver-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ════════════════════════════════════════════════
   DATA
════════════════════════════════════════════════ */
const COMPANY = { name: "Nordic Transport AB", initials: "NT" };

const NAV_ITEMS = [
  { id: "oversikt", label: "Översikt" },
  { id: "annonser", label: "Annonser" },
  { id: "hitta",    label: "Hitta förare" },
  { id: "inkorg",   label: "Inkorg", badge: 3 },
  { id: "profil",   label: "Företagsprofil" },
];

const DRIVERS = [
  { id:0, name:"Erik Johansson",   initials:"EJ", loc:"Malmö",       region:"Skåne", exp:8,  license:["CE"], certs:["YKB","ADR"],        segment:"Fjärr",        avail:"Söker aktivt",     active:"Online nu", match:94, starred:true },
  { id:1, name:"Karin Olsson",     initials:"KO", loc:"Malmö",       region:"Skåne", exp:22, license:["CE"], certs:["YKB"],              segment:"Fjärr",        avail:"Söker aktivt",     active:"2h sen",    match:91, starred:false },
  { id:2, name:"Mikael Stenberg",  initials:"MS", loc:"Lund",        region:"Skåne", exp:15, license:["CE"], certs:["YKB","ADR Tank"],   segment:"Tank",         avail:"Öppen för förslag",active:"Igår",      match:78, starred:false },
  { id:3, name:"Anders Bergström", initials:"AB", loc:"Malmö",       region:"Skåne", exp:12, license:["CE"], certs:["YKB","ADR","Kran"], segment:"Fjärr",        avail:"Söker aktivt",     active:"4h sen",    match:88, starred:true },
  { id:4, name:"Sara Pettersson",  initials:"SP", loc:"Helsingborg", region:"Skåne", exp:5,  license:["CE"], certs:["YKB"],              segment:"Fjärr",        avail:"Söker aktivt",     active:"Online nu", match:86, starred:false },
  { id:5, name:"Maria Svensson",   initials:"MS", loc:"Lund",        region:"Skåne", exp:7,  license:["CE"], certs:["YKB"],              segment:"Distribution", avail:"Söker aktivt",     active:"5h sen",    match:84, starred:true },
];

/* Förare per län — talangkarta. matches = förare som matchar era annonser. */
const REGION_DATA = [
  { id:"skane",          code:"M",  name:"Skåne",           region:"Skåne",           jobs:47, new:5, matches:6,
    cities:[ {name:"Malmö",dx:-12,dy:14,jobs:24},{name:"Helsingborg",dx:-15,dy:-6,jobs:13},{name:"Lund",dx:6,dy:6,jobs:10} ]},
  { id:"stockholm",      code:"AB", name:"Stockholm",       region:"Stockholm",       jobs:38, new:4, matches:3,
    cities:[ {name:"Stockholm",dx:2,dy:6,jobs:24},{name:"Södertälje",dx:-9,dy:14,jobs:8},{name:"Norrtälje",dx:11,dy:-12,jobs:6} ]},
  { id:"vastra-gotaland",code:"O",  name:"Västra Götaland", region:"Västra Götaland", jobs:31, new:3, matches:2,
    cities:[ {name:"Göteborg",dx:-14,dy:18,jobs:20},{name:"Borås",dx:10,dy:14,jobs:7},{name:"Trollhättan",dx:-8,dy:-12,jobs:4} ]},
  { id:"ostergotland",   code:"E",  name:"Östergötland",    region:"Östergötland",    jobs:14, new:2, matches:1,
    cities:[ {name:"Linköping",dx:0,dy:6,jobs:9},{name:"Norrköping",dx:8,dy:-6,jobs:5} ]},
  { id:"halland",        code:"N",  name:"Halland",         region:"Halland",         jobs:12, new:1, matches:1,
    cities:[ {name:"Halmstad",dx:2,dy:14,jobs:7},{name:"Varberg",dx:-4,dy:-10,jobs:5} ]},
  { id:"jonkoping",      code:"F",  name:"Jönköping",       region:"Jönköping",       jobs:11, new:1, matches:0,
    cities:[ {name:"Jönköping",dx:0,dy:8,jobs:7},{name:"Värnamo",dx:-6,dy:-8,jobs:4} ]},
  { id:"uppsala",        code:"C",  name:"Uppsala",         region:"Uppsala",         jobs:9,  new:1, matches:0, nudge:{x:-4,y:-10},
    cities:[ {name:"Uppsala",dx:3,dy:2,jobs:6},{name:"Enköping",dx:-10,dy:10,jobs:3} ]},
  { id:"vasternorrland", code:"Y",  name:"Västernorrland",  region:"Västernorrland",  jobs:7,  new:2, matches:1,
    cities:[ {name:"Sundsvall",dx:-6,dy:14,jobs:5},{name:"Örnsköldsvik",dx:16,dy:-10,jobs:2} ]},
];

const REGIONS    = ["Skåne","Stockholm","Västra Götaland","Halland","Uppsala","Östergötland"];
const SEGMENTS   = ["Fjärr","Distribution","Tank","Bygg","Skog"];
const LICENSES   = ["B","C","CE","D"];

const MAP_LABELS = {
  legendTitle: "Förare per län",
  sizeNote:    "Fler förare = större",
  matchNote:   "Matchar era annonser",
  newNote:     "Nya profiler",
  hint:        "Klicka på ett län för att se var förarna finns.",
  inCounty:    "förare i länet",
  unit:        "tillgängliga förare",
  matchUnit:   "matchar era annonser",
  pickAll:     (n, name) => `Visa alla ${n} förare i ${name}`,
};

/* ════════════════════════════════════════════════
   DRIVER CARD
════════════════════════════════════════════════ */
const DriverCard = ({ d, onStar }) => (
  <article style={{
    background: "var(--card)", border: "1px solid var(--line)",
    borderRadius: "var(--r-lg)", padding: "18px 20px", boxShadow: "var(--sh-sm)",
    transition: "box-shadow .15s, border-color .15s", cursor: "pointer",
  }}
  onMouseEnter={e => { e.currentTarget.style.boxShadow = "var(--sh)"; e.currentTarget.style.borderColor = "var(--line-2)"; }}
  onMouseLeave={e => { e.currentTarget.style.boxShadow = "var(--sh-sm)"; e.currentTarget.style.borderColor = "var(--line)"; }}
  >
    <div style={{ display: "flex", gap: 14, alignItems: "flex-start" }}>
      <Avatar initials={d.initials} size={46}/>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
          <div>
            <div style={{ fontSize: 15.5, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.2 }}>{d.name}</div>
            <div style={{ fontSize: 12.5, color: "var(--ink-500)", marginTop: 2 }}>
              {d.loc} · {d.exp} års erfarenhet
            </div>
          </div>
          <button onClick={(e) => { e.stopPropagation(); onStar(d.id); }} style={{
            width: 32, height: 32, borderRadius: 8,
            background: d.starred ? "var(--amber-tint)" : "var(--card-2)",
            border: `1px solid ${d.starred ? "rgba(199,122,14,0.3)" : "var(--line-2)"}`,
            display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
          }}>
            <Icon name="star" size={14} color={d.starred ? "var(--amber-deep)" : "var(--ink-400)"} stroke={d.starred ? 0 : 2}/>
          </button>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 12, marginBottom: 12 }}>
          {d.license.map(l => <Pill key={l} tone="primary" size="sm">{l}</Pill>)}
          {d.certs.slice(0, 2).map(c => <Pill key={c} tone="neutral" size="sm">{c}</Pill>)}
          <Pill tone="soft" size="sm">{d.segment}</Pill>
        </div>

        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          paddingTop: 12, borderTop: "1px solid var(--line)",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <Dot tone={d.avail === "Söker aktivt" ? "success" : "amber"} size={7}/>
            <span style={{ fontSize: 12.5, color: "var(--ink-700)", fontWeight: 600 }}>{d.avail}</span>
            <span style={{ fontSize: 11.5, color: "var(--ink-400)" }}>· {d.active}</span>
          </div>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 6,
            padding: "4px 10px", borderRadius: 999,
            background: d.match >= 85 ? "var(--success-tint)" : "var(--green-tint)",
          }}>
            <span style={{
              fontSize: 14, fontWeight: 800, fontFamily: "var(--mono)",
              color: d.match >= 85 ? "var(--success)" : "var(--green-text)",
            }}>{d.match}%</span>
            <span style={{ fontSize: 11, fontWeight: 700, color: d.match >= 85 ? "var(--success)" : "var(--green-text)" }}>match</span>
          </div>
        </div>
      </div>
    </div>
  </article>
);

/* ════════════════════════════════════════════════
   SELECT
════════════════════════════════════════════════ */
const Select = ({ value, onChange, options, placeholder, width = 150 }) => (
  <div style={{ position: "relative", width }}>
    <select value={value} onChange={e => onChange(e.target.value)} style={{
      appearance: "none", WebkitAppearance: "none", width: "100%",
      padding: "11px 32px 11px 14px",
      background: value ? "var(--green-tint)" : "var(--card)",
      border: `1px solid ${value ? "var(--green)" : "var(--line-2)"}`,
      borderRadius: 10, fontSize: 13.5, fontWeight: value ? 700 : 500,
      color: value ? "var(--green-text)" : "var(--ink-900)",
      boxShadow: "var(--sh-sm)", cursor: "pointer", fontFamily: "var(--font)", outline: "none",
    }}>
      <option value="">{placeholder}</option>
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
    <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", pointerEvents: "none", color: value ? "var(--green-text)" : "var(--ink-500)" }}>
      <Icon name="chevDown" size={14} stroke={2}/>
    </span>
  </div>
);

/* ════════════════════════════════════════════════
   PAGE HEADER
════════════════════════════════════════════════ */
const PageHeader = ({ count, view, setView }) => (
  <div style={{ background: "var(--paper)", borderBottom: "1px solid var(--line)", paddingTop: 32, paddingBottom: 18 }}>
    <div style={{ maxWidth: 1240, margin: "0 auto", padding: "0 32px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16 }}>
        <div>
          <p style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-500)", letterSpacing: 1.4, textTransform: "uppercase", marginBottom: 10 }}>För åkerier</p>
          <h1 style={{ fontSize: 38, fontWeight: 900, color: "var(--ink-900)", letterSpacing: -1.5, lineHeight: 1.15, marginBottom: 6 }}>Hitta förare</h1>
          <p style={{ fontSize: 14, color: "var(--ink-500)", fontWeight: 500 }}>
            {count} tillgängliga förare · Matchade mot era annonser
          </p>
        </div>

        <div style={{
          display: "flex", padding: 4, gap: 3,
          background: "var(--card)", border: "1px solid var(--line-2)",
          borderRadius: 10, boxShadow: "var(--sh-sm)",
        }}>
          {[["list","Lista","menu"],["map","Karta","pin"]].map(([k, label, icon]) => (
            <button key={k} onClick={() => setView(k)} style={{
              display: "inline-flex", alignItems: "center", gap: 7,
              padding: "7px 14px", borderRadius: 7,
              background: view === k ? "var(--green)" : "transparent",
              color: view === k ? "#fff" : "var(--ink-700)",
              fontSize: 13, fontWeight: 600, transition: "all .12s",
            }}>
              <Icon name={icon} size={13} color={view === k ? "#fff" : "var(--ink-700)"} stroke={2}/>
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  </div>
);

/* ════════════════════════════════════════════════
   PAGE
════════════════════════════════════════════════ */
const Page = () => {
  const [nav, setNav] = useState("hitta");
  const [view, setView] = useState("list");
  const [filters, setFilters] = useState({ region: "", license: "", segment: "" });
  const [drivers, setDrivers] = useState(DRIVERS);

  const star = id => setDrivers(ds => ds.map(d => d.id === id ? { ...d, starred: !d.starred } : d));

  const filtered = drivers.filter(d =>
    (!filters.region || d.region === filters.region) &&
    (!filters.license || d.license.includes(filters.license)) &&
    (!filters.segment || d.segment === filters.segment)
  );

  const activeChips = [];
  if (filters.region)  activeChips.push({ key: "region",  label: filters.region });
  if (filters.license) activeChips.push({ key: "license", label: filters.license + "-körkort" });
  if (filters.segment) activeChips.push({ key: "segment", label: filters.segment });

  return (
    <PageShell>
      <TopNav items={NAV_ITEMS} active={nav} onActive={setNav}
        brand="STP" brandSub="Åkeri"
        currentUser={{ initials: COMPANY.initials, label: COMPANY.name }}/>

      <PageHeader count={REGION_DATA.reduce((s, r) => s + r.jobs, 0)} view={view} setView={setView}/>

      <main style={{ maxWidth: 1240, margin: "0 auto", padding: "0 32px 80px" }}>
        {view === "map" ? (
          <div className="stp-fade-up" style={{ paddingTop: 24 }}>
            <p style={{ fontSize: 14, color: "var(--ink-500)", marginBottom: 16, fontWeight: 500, maxWidth: 600 }}>
              Var finns förarna? Bubblans storlek visar antal tillgängliga förare per län —
              bärnstensring betyder att förare där matchar era öppna annonser. Använd det för att
              planera var ni rekryterar eller om ni ska erbjuda relocation.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 300px", gap: 20, alignItems: "start" }}>
              <SwedenJobMap
                regions={REGION_DATA}
                labels={MAP_LABELS}
                onPickRegion={(r) => { setFilters(f => ({ ...f, region: r.region })); setView("list"); }}
                height={580}
              />
              <Card padding="8px 10px">
                <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.3, textTransform: "uppercase", color: "var(--ink-500)", padding: "12px 14px 10px" }}>
                  Förare per län
                </div>
                {[...REGION_DATA].sort((a, b) => b.jobs - a.jobs).map(r => (
                  <button key={r.id} onClick={() => { setFilters(f => ({ ...f, region: r.region })); setView("list"); }}
                    style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "11px 14px", borderRadius: 10, textAlign: "left", transition: "background .12s" }}
                    onMouseEnter={e => e.currentTarget.style.background = "var(--card-2)"}
                    onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                    <span style={{ width: 38, height: 38, borderRadius: 9, background: "var(--green)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 800, fontFamily: "var(--mono)", flexShrink: 0 }}>{r.jobs}</span>
                    <span style={{ flex: 1, minWidth: 0 }}>
                      <span style={{ display: "block", fontSize: 14, fontWeight: 700, color: "var(--ink-900)" }}>{r.name}</span>
                      <span style={{ display: "block", fontSize: 12, color: "var(--ink-500)", marginTop: 1 }}>
                        {r.matches > 0
                          ? <span style={{ color: "var(--amber-deep)", fontWeight: 600 }}>{r.matches} matchar era annonser</span>
                          : `${r.new} nya profiler`}
                      </span>
                    </span>
                    <Icon name="chevRight" size={14} color="var(--ink-300)" stroke={2}/>
                  </button>
                ))}
              </Card>
            </div>
          </div>
        ) : (
          <React.Fragment>
            {/* Filter bar */}
            <div style={{ paddingTop: 22, paddingBottom: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <div style={{ position: "relative", flex: "1 1 260px", maxWidth: 440 }}>
                  <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: "var(--ink-400)" }}>
                    <Icon name="search" size={16} stroke={2}/>
                  </span>
                  <input placeholder="Sök namn, ort, kompetens..." style={{
                    width: "100%", padding: "11px 16px 11px 42px", background: "var(--card)",
                    border: "1px solid var(--line-2)", borderRadius: 10, fontSize: 14,
                    color: "var(--ink-900)", outline: "none", boxShadow: "var(--sh-sm)", fontFamily: "var(--font)",
                  }}/>
                </div>
                <div style={{ flex: 1, minWidth: 8 }}/>
                <Select value={filters.license} onChange={v => setFilters(f => ({ ...f, license: v }))} options={LICENSES} placeholder="Körkort" width={130}/>
                <Select value={filters.segment} onChange={v => setFilters(f => ({ ...f, segment: v }))} options={SEGMENTS} placeholder="Segment" width={140}/>
                <Select value={filters.region}  onChange={v => setFilters(f => ({ ...f, region: v }))}  options={REGIONS}  placeholder="Region" width={156}/>
              </div>
              {activeChips.length > 0 && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 14 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "var(--ink-500)", letterSpacing: 1.2, textTransform: "uppercase" }}>Aktiva filter</span>
                  {activeChips.map(c => (
                    <Pill key={c.key} tone="soft" size="sm" onRemove={() => setFilters(f => ({ ...f, [c.key]: "" }))}>{c.label}</Pill>
                  ))}
                  <button onClick={() => setFilters({ region: "", license: "", segment: "" })} style={{ fontSize: 12.5, fontWeight: 700, color: "var(--green)", marginLeft: 4 }}>Rensa alla</button>
                </div>
              )}
            </div>

            <div className="find-grid">
              <div className="stp-fade-up">
                <div style={{ fontSize: 13, color: "var(--ink-500)", fontWeight: 600, marginBottom: 14 }}>
                  {filtered.length} förare {filters.region ? `i ${filters.region}` : "matchar"}
                </div>
                {filtered.length === 0 ? (
                  <Card padding="56px 32px" style={{ textAlign: "center" }}>
                    <h3 style={{ fontSize: 16, fontWeight: 700, color: "var(--ink-900)", marginBottom: 6 }}>Inga förare matchar filtren</h3>
                    <p style={{ fontSize: 14, color: "var(--ink-500)", marginBottom: 18 }}>Prova bredare filter eller kolla kartan för var förarna finns.</p>
                    <Button variant="secondary" size="sm" onClick={() => setFilters({ region: "", license: "", segment: "" })}>Rensa filter</Button>
                  </Card>
                ) : (
                  <div className="driver-grid">
                    {filtered.map(d => <DriverCard key={d.id} d={d} onStar={star}/>)}
                  </div>
                )}
              </div>

              {/* Sidebar */}
              <aside style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                <Card style={{ background: "var(--card-2)" }}>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                    <span style={{ width: 36, height: 36, borderRadius: 9, background: "var(--green-tint)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <Icon name="pin" size={17} color="var(--green-text)" stroke={2}/>
                    </span>
                    <div>
                      <div style={{ fontSize: 14.5, fontWeight: 700, color: "var(--ink-900)", marginBottom: 4 }}>Var finns förarna?</div>
                      <p style={{ fontSize: 13, color: "var(--ink-500)", lineHeight: 1.55, marginBottom: 12 }}>
                        Se talangkartan för att förstå var det finns flest förare — och planera rekrytering därefter.
                      </p>
                      <Button variant="secondary" size="sm" full icon={<Icon name="pin" size={13} stroke={2}/>}>Öppna talangkartan</Button>
                    </div>
                  </div>
                </Card>

                <Card>
                  <SectionLabel>Era öppna annonser</SectionLabel>
                  {[
                    { t: "CE-chaufför fjärr", n: 12 },
                    { t: "Distribution Sthlm", n: 8 },
                    { t: "Tankbil ADR", n: 6 },
                  ].map(j => (
                    <div key={j.t} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid var(--line)" }}>
                      <span style={{ fontSize: 13.5, color: "var(--ink-900)", fontWeight: 600 }}>{j.t}</span>
                      <Pill tone="soft" size="sm">{j.n} matchar</Pill>
                    </div>
                  ))}
                </Card>
              </aside>
            </div>
          </React.Fragment>
        )}
      </main>
    </PageShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
