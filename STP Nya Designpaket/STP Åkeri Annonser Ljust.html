<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Annonser</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const JOBS = [
  { id:0, title:"CE-chaufför fjärrkörning", loc:"Malmö",     segment:"Fjärr",        status:"active", deadline:"22 dgr kvar", days:6,  views:84,  applicants:12, new:3, contacted:4, interviewed:2, hired:0, salary:"35 000–42 000", type:"Heltid · Tillsvidare", hot:true },
  { id:1, title:"Distributionschaufför",    loc:"Stockholm", segment:"Distribution", status:"active", deadline:"17 dgr kvar", days:11, views:51,  applicants:8,  new:2, contacted:3, interviewed:1, hired:0, salary:"30 000–36 000", type:"Heltid · Tillsvidare" },
  { id:2, title:"Tankbilschaufför ADR",     loc:"Malmö",     segment:"ADR · Tank",   status:"active", deadline:"24 dgr kvar", days:4,  views:38,  applicants:6,  new:2, contacted:1, interviewed:0, hired:0, salary:"38 000–45 000", type:"Heltid · Tillsvidare", hot:true },
  { id:3, title:"Lokal CE-tjänst",          loc:"Göteborg",  segment:"Distribution", status:"active", deadline:"10 dgr kvar", days:18, views:23,  applicants:4,  new:0, contacted:2, interviewed:1, hired:0, salary:"32 000–38 000", type:"Heltid · Tillsvidare", lowTraffic:true },
  { id:4, title:"Helgchaufför distribution",loc:"Lund",      segment:"Distribution", status:"paused", deadline:"Pausad",      days:14, views:17,  applicants:2,  new:0, contacted:0, interviewed:0, hired:0, salary:"28 000–33 000", type:"Deltid · Helger" },
  { id:5, title:"Lastbilsmekaniker",        loc:"Malmö",     segment:"Verkstad",     status:"closed", deadline:"Stängd 12 nov",days:42, views:142, applicants:18, new:0, contacted:6, interviewed:3, hired:1, salary:"34 000–40 000", type:"Heltid · Tillsvidare" },
];

const NAV_ITEMS = [
  { id: "oversikt", label: "Översikt" },
  { id: "annonser", label: "Annonser" },
  { id: "hitta",    label: "Hitta förare" },
  { id: "inkorg",   label: "Inkorg", badge: 3 },
  { id: "profil",   label: "Företagsprofil" },
];
const COMPANY = { initials: "NT", name: "Nordic Transport AB" };

const statusMeta = {
  active: { label: "Aktiv",  tone: "success" },
  paused: { label: "Pausad", tone: "amber" },
  closed: { label: "Stängd", tone: "neutral" },
};

/* ════════════════════════════════════════════════
   MINI FUNNEL
════════════════════════════════════════════════ */
const Funnel = ({ j }) => {
  const stages = [
    { label: "Sökande",    value: j.applicants, tone: "var(--green)" },
    { label: "Kontaktade", value: j.contacted,  tone: "var(--green-soft)" },
    { label: "Intervju",   value: j.interviewed,tone: "var(--amber)" },
    { label: "Anställda",  value: j.hired,      tone: "var(--success)" },
  ];
  return (
    <div style={{ display: "flex", alignItems: "stretch", gap: 6 }}>
      {stages.map((s, i) => (
        <div key={s.label} style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            background: "var(--card-2)", border: "1px solid var(--line)",
            borderRadius: 9, padding: "9px 10px", textAlign: "center",
          }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: s.value > 0 ? "var(--ink-900)" : "var(--ink-300)", fontFamily: "var(--mono)", lineHeight: 1 }}>{s.value}</div>
            <div style={{ fontSize: 10, color: "var(--ink-500)", marginTop: 4, fontWeight: 600, letterSpacing: 0.2, textTransform: "uppercase" }}>{s.label}</div>
          </div>
        </div>
      ))}
    </div>
  );
};

/* ════════════════════════════════════════════════
   AD CARD
════════════════════════════════════════════════ */
const AdCard = ({ j }) => {
  const meta = statusMeta[j.status];
  return (
    <Card padding="20px 24px" style={{ background: j.lowTraffic ? "var(--amber-tint)" : "var(--card)", borderColor: j.lowTraffic ? "rgba(199,122,14,0.22)" : "var(--line)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 14, marginBottom: 16 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <h3 style={{ fontSize: 17, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.3 }}>{j.title}</h3>
            <Pill tone={meta.tone} size="sm">{meta.label}</Pill>
            {j.hot && <Pill tone="amberSolid" size="sm">HOT</Pill>}
            {j.lowTraffic && <Pill tone="amber" size="sm" icon={<Icon name="alert" size={10} color="var(--amber-deep)" stroke={2.4}/>}>Behöver attention</Pill>}
          </div>
          <div style={{ fontSize: 13, color: "var(--ink-500)", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><Icon name="pin" size={12} color="var(--ink-500)" stroke={1.8}/>{j.loc}</span>
            <span>· {j.segment}</span>
            <span>· <span style={{ fontFamily: "var(--mono)", fontWeight: 600 }}>{j.salary} kr</span></span>
            <span>· {j.deadline}</span>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
          {j.new > 0 && <Pill tone="danger" size="sm" icon={<Dot tone="danger" size={5}/>}>{j.new} nya</Pill>}
          <Button variant="secondary" size="sm">Hantera</Button>
        </div>
      </div>

      <Funnel j={j}/>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--line)" }}>
        <div style={{ display: "flex", gap: 18, fontSize: 12.5, color: "var(--ink-500)" }}>
          <span><strong style={{ color: "var(--ink-900)", fontFamily: "var(--mono)" }}>{j.views}</strong> visningar</span>
          <span><strong style={{ color: "var(--ink-900)", fontFamily: "var(--mono)" }}>{j.days}</strong> dgr aktiv</span>
        </div>
        <Button variant="primary" size="sm" iconRight={<Icon name="arrow" size={12} stroke={2.2}/>}>Se ansökningar</Button>
      </div>
    </Card>
  );
};

/* ════════════════════════════════════════════════
   PAGE
════════════════════════════════════════════════ */
const Page = () => {
  const [nav, setNav] = useState("annonser");
  const [tab, setTab] = useState("active");

  const counts = {
    active: JOBS.filter(j => j.status === "active").length,
    paused: JOBS.filter(j => j.status === "paused").length,
    closed: JOBS.filter(j => j.status === "closed").length,
    all: JOBS.length,
  };
  const list = JOBS.filter(j => tab === "all" ? true : j.status === tab);
  const tabs = [
    { k: "active", l: "Aktiva",  c: counts.active },
    { k: "paused", l: "Pausade", c: counts.paused },
    { k: "closed", l: "Stängda", c: counts.closed },
    { k: "all",    l: "Alla",    c: counts.all },
  ];

  const totalApplicants = JOBS.reduce((s, j) => s + j.applicants, 0);
  const totalNew = JOBS.reduce((s, j) => s + j.new, 0);

  return (
    <PageShell>
      <TopNav items={NAV_ITEMS} active={nav} onActive={setNav} brand="STP" brandSub="Åkeri" currentUser={COMPANY}/>

      <div style={{ background: "var(--paper)", borderBottom: "1px solid var(--line)", paddingTop: 32, paddingBottom: 12 }}>
        <div style={{ maxWidth: 1040, margin: "0 auto", padding: "0 32px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16, marginBottom: 24 }}>
            <div>
              <p style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-500)", letterSpacing: 1.4, textTransform: "uppercase", marginBottom: 10 }}>För åkerier</p>
              <h1 style={{ fontSize: 38, fontWeight: 900, color: "var(--ink-900)", letterSpacing: -1.5, lineHeight: 1.15, marginBottom: 6 }}>Annonser</h1>
              <p style={{ fontSize: 14, color: "var(--ink-500)", fontWeight: 500 }}>
                {totalApplicants} sökande totalt{totalNew > 0 && <> · <span style={{ color: "var(--amber-deep)", fontWeight: 700 }}>{totalNew} nya att granska</span></>}
              </p>
            </div>
            <Button variant="primary" size="md" icon={<Icon name="plus" size={14} stroke={2.4}/>}>Publicera annons</Button>
          </div>
          <div style={{ display: "flex", gap: 0, borderBottom: "1px solid var(--line)" }}>
            {tabs.map(t => {
              const isActive = tab === t.k;
              return (
                <button key={t.k} onClick={() => setTab(t.k)} style={{
                  padding: "12px 18px 14px", position: "relative",
                  fontSize: 14, fontWeight: isActive ? 700 : 500,
                  color: isActive ? "var(--ink-900)" : "var(--ink-500)",
                  display: "inline-flex", alignItems: "center", gap: 8,
                }}>
                  {t.l}
                  <span style={{ padding: "1px 8px", borderRadius: 999, background: isActive ? "var(--green-tint)" : "var(--paper-2)", color: isActive ? "var(--green-text)" : "var(--ink-500)", fontSize: 11, fontWeight: 800 }}>{t.c}</span>
                  {isActive && <span style={{ position: "absolute", left: 18, right: 18, bottom: -1, height: 3, background: "var(--green)", borderRadius: "3px 3px 0 0" }}/>}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      <main style={{ maxWidth: 1040, margin: "0 auto", padding: "24px 32px 80px" }}>
        <div className="stp-fade-up" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {list.length === 0
            ? <Card padding="56px 32px" style={{ textAlign: "center" }}><h3 style={{ fontSize: 16, fontWeight: 700, color: "var(--ink-900)", marginBottom: 6 }}>Inga annonser här</h3><p style={{ fontSize: 14, color: "var(--ink-500)" }}>Annonser med den här statusen visas här.</p></Card>
            : list.map(j => <AdCard key={j.id} j={j}/>)}
        </div>
      </main>
    </PageShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
