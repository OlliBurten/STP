<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Förarprofil (mobil, åkeri)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const D = {
  name:"Erik Johansson", initials:"EJ", age:34, loc:"Malmö", region:"Skåne", exp:8, avail:"Söker aktivt", active:"Online nu", match:94,
  summary:"Erfaren CE-chaufför med 8 år i fjärrtrafik mellan Sverige och Tyskland. Lugn och pålitlig — har aldrig haft missade leveranser.",
  licenses:["CE"], certs:["YKB","ADR klass 3","Digitalt förarkort"],
  breakdown:[{l:"CE-körkort",on:true},{l:"YKB",on:true},{l:"ADR klass 3",on:true},{l:"Region Skåne",on:true},{l:"3+ års erfarenhet",on:true}],
  experience:[{role:"CE-chaufför fjärr",company:"Skånetransport AB",years:"2020 – nu"},{role:"Distribution",company:"Pettersson Logistik",years:"2017 – 2020"}],
};

const Back = () => (
  <div style={{ background:"var(--paper)", padding:"4px 12px 8px" }}>
    <button style={{ width:38, height:38, borderRadius:"50%", background:"var(--card)", border:"1px solid var(--line)", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"var(--sh-sm)" }}><Icon name="arrowLeft" size={18} color="var(--ink-900)" stroke={2}/></button>
  </div>
);

const App = () => {
  const [saved, setSaved] = useState(true);
  return (
    <MobileShell noTabs header={<Back/>} footer={
      <div style={{ background:"var(--card)", borderTop:"1px solid var(--line)", padding:"12px 16px 24px", display:"flex", gap:10 }}>
        <button onClick={() => setSaved(s=>!s)} style={{ width:50, borderRadius:12, background:saved?"var(--amber-tint)":"var(--card-2)", border:`1px solid ${saved?"rgba(199,122,14,0.3)":"var(--line-2)"}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name="star" size={18} color={saved?"var(--amber-deep)":"var(--ink-500)"} stroke={saved?0:2}/></button>
        <Button variant="primary" size="lg" icon={<Icon name="msg" size={15} stroke={2}/>} style={{ flex:1 }}>Kontakta Erik</Button>
      </div>
    }>
      <div style={{ padding:"4px 16px 24px", display:"flex", flexDirection:"column", gap:14 }}>
        {/* Hero */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:18, padding:"20px 18px", boxShadow:"var(--sh-sm)", textAlign:"center" }}>
          <Avatar initials={D.initials} size={72} style={{ margin:"0 auto 12px" }}/>
          <h1 style={{ fontSize:21, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.5, marginBottom:4 }}>{D.name}</h1>
          <div style={{ fontSize:13, color:"var(--ink-500)", marginBottom:12 }}>{D.loc}, {D.region} · {D.age} år · {D.exp} års erfarenhet</div>
          <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
            <Pill tone="success" size="sm" icon={<Dot tone="success" size={5}/>}>{D.avail}</Pill>
            <Pill tone="neutral" size="sm">{D.active}</Pill>
          </div>
        </div>

        {/* Match */}
        <div style={{ background:"var(--success-tint)", borderRadius:14, padding:"16px", display:"flex", alignItems:"center", gap:16 }}>
          <div style={{ position:"relative", width:60, height:60, flexShrink:0 }}>
            <svg width="60" height="60" viewBox="0 0 60 60" style={{ transform:"rotate(-90deg)" }}>
              <circle cx="30" cy="30" r="25" fill="none" stroke="rgba(31,122,58,0.18)" strokeWidth="5"/>
              <circle cx="30" cy="30" r="25" fill="none" stroke="var(--success)" strokeWidth="5" strokeLinecap="round" strokeDasharray={2*Math.PI*25} strokeDashoffset={2*Math.PI*25 - (D.match/100)*2*Math.PI*25}/>
            </svg>
            <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, fontWeight:800, color:"var(--success)", fontFamily:"var(--mono)" }}>{D.match}</div>
          </div>
          <div><div style={{ fontSize:14.5, fontWeight:800, color:"var(--ink-900)" }}>Stark match</div><div style={{ fontSize:12.5, color:"var(--ink-600)" }}>mot CE-chaufför fjärrkörning</div></div>
        </div>

        {/* Chips */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:10 }}>Behörigheter</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{D.licenses.map(l => <Pill key={l} tone="primary">{l}</Pill>)}{D.certs.map(c => <Pill key={c} tone="neutral">{c}</Pill>)}</div>
        </div>

        {/* Summary */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:10 }}>Presentation</div>
          <p style={{ fontSize:14, color:"var(--ink-700)", lineHeight:1.6 }}>{D.summary}</p>
        </div>

        {/* Breakdown */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:12 }}>Matchningsdetaljer</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {D.breakdown.map(b => <div key={b.l} style={{ display:"flex", alignItems:"center", gap:9 }}><span style={{ width:18, height:18, borderRadius:9, background:"var(--success-tint)", display:"flex", alignItems:"center", justifyContent:"center" }}><Icon name="check" size={10} color="var(--success)" stroke={3}/></span><span style={{ fontSize:13.5, color:"var(--ink-700)" }}>{b.l}</span></div>)}
          </div>
        </div>

        {/* Experience */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:10 }}>Erfarenhet</div>
          {D.experience.map((e, i) => <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderBottom:i<D.experience.length-1?"1px solid var(--line)":"none" }}><div><div style={{ fontSize:14, fontWeight:700, color:"var(--ink-900)" }}>{e.role}</div><div style={{ fontSize:12.5, color:"var(--ink-500)" }}>{e.company}</div></div><span style={{ fontSize:12, color:"var(--ink-500)", fontFamily:"var(--mono)" }}>{e.years}</span></div>)}
        </div>
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
