<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Jobbdetalj (mobil)</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const JOB = {
  title: "CE-chaufför fjärrkörning", company: "Nordic Transport AB", logo: "NT", location: "Malmö, Skåne",
  salaryMin: 36000, salaryMax: 42000, salaryNote: "Lön enligt SLA + OB", employment: "Fast anställning",
  schedule: "Heltid, mån–fre", start: "1 juni 2026", verified: true, kollektivavtal: true, match: 94,
  about: "Vi söker en erfaren CE-chaufför till vår fjärrkörningsavdelning i Malmö. Du kör moderna lastbilar på rutter i Norden. Övernattningar 2–3 gånger per vecka med full ersättning.",
  tasks: ["Fjärrkörning inom Norden", "Lastning och lossning", "Daglig fordonskontroll", "Dokumentation i digitalt system"],
  offers: ["Kollektivavtal med Transport", "Nya Volvo FH 2024", "Betald övernattning + traktamente", "Friskvårdsbidrag 4 000 kr/år"],
};

const Back = ({ saved, onSave }) => (
  <div style={{ background: "var(--paper)", padding: "4px 12px 10px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
    <button style={{ width: 38, height: 38, borderRadius: "50%", background: "var(--card)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "var(--sh-sm)" }}>
      <Icon name="arrowLeft" size={18} color="var(--ink-900)" stroke={2}/>
    </button>
    <div style={{ display: "flex", gap: 8 }}>
      <button onClick={onSave} style={{ width: 38, height: 38, borderRadius: "50%", background: saved ? "var(--amber-tint)" : "var(--card)", border: `1px solid ${saved ? "rgba(199,122,14,0.3)" : "var(--line)"}`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "var(--sh-sm)" }}>
        <Icon name="heart" size={16} color={saved ? "var(--amber-deep)" : "var(--ink-500)"} stroke={saved ? 0 : 2}/>
      </button>
      <button style={{ width: 38, height: 38, borderRadius: "50%", background: "var(--card)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "var(--sh-sm)" }}>
        <Icon name="link" size={15} color="var(--ink-500)" stroke={2}/>
      </button>
    </div>
  </div>
);

const ApplyBar = () => (
  <div style={{ background: "var(--card)", borderTop: "1px solid var(--line)", padding: "12px 16px 24px", display: "flex", alignItems: "center", gap: 12 }}>
    <div style={{ flex: 1 }}>
      <div style={{ fontSize: 15, fontWeight: 800, color: "var(--ink-900)", fontFamily: "var(--mono)", lineHeight: 1 }}>{JOB.salaryMin.toLocaleString("sv-SE")}–{JOB.salaryMax.toLocaleString("sv-SE")}</div>
      <div style={{ fontSize: 11.5, color: "var(--ink-500)", marginTop: 2 }}>kr/mån</div>
    </div>
    <Button variant="primary" size="lg" iconRight={<Icon name="arrow" size={15} stroke={2.2}/>} style={{ flex: 1.4 }}>Ansök nu</Button>
  </div>
);

const Section = ({ title, children }) => (
  <div style={{ marginTop: 22 }}>
    <h2 style={{ fontSize: 16, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.3, marginBottom: 12 }}>{title}</h2>
    {children}
  </div>
);

const Bullets = ({ items, tone = "primary" }) => {
  const color = tone === "success" ? "var(--success)" : "var(--green)";
  const tint = tone === "success" ? "var(--success-tint)" : "var(--green-tint)";
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {items.map((it, i) => (
        <div key={i} style={{ display: "flex", gap: 11, alignItems: "flex-start" }}>
          <span style={{ width: 20, height: 20, borderRadius: 10, background: tint, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>
            <Icon name="check" size={11} color={color} stroke={3}/>
          </span>
          <span style={{ fontSize: 14, color: "var(--ink-700)", lineHeight: 1.55 }}>{it}</span>
        </div>
      ))}
    </div>
  );
};

const App = () => {
  const [saved, setSaved] = useState(false);
  return (
    <MobileShell noTabs header={<Back saved={saved} onSave={() => setSaved(s => !s)}/>} footer={<ApplyBar/>}>
      <div style={{ padding: "8px 18px 28px" }}>
        {/* Header */}
        <div style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 16 }}>
          <div style={{ width: 56, height: 56, borderRadius: 14, background: "var(--paper-2)", border: "1px solid var(--line-2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, fontWeight: 800, color: "var(--ink-700)", flexShrink: 0 }}>{JOB.logo}</div>
          <div>
            <h1 style={{ fontSize: 21, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.5, lineHeight: 1.2, marginBottom: 6 }}>{JOB.title}</h1>
            <div style={{ fontSize: 13.5, color: "var(--ink-500)", display: "flex", alignItems: "center", gap: 5 }}>
              {JOB.company}{JOB.verified && <Icon name="check" size={11} color="var(--success)" stroke={3}/>}
            </div>
          </div>
        </div>

        {/* Match banner */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: "var(--success-tint)", borderRadius: 12, marginBottom: 16 }}>
          <span style={{ fontSize: 20, fontWeight: 800, color: "var(--success)", fontFamily: "var(--mono)" }}>{JOB.match}%</span>
          <div>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: "var(--ink-900)" }}>Stark match</div>
            <div style={{ fontSize: 12, color: "var(--ink-600)" }}>Din profil passar tjänsten väl</div>
          </div>
        </div>

        {/* Chips */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
          <Pill tone="primary">CE</Pill>
          <Pill tone="soft">{JOB.employment}</Pill>
          <Pill tone="neutral">{JOB.schedule}</Pill>
          {JOB.kollektivavtal && <Pill tone="info">Kollektivavtal</Pill>}
        </div>

        {/* Facts */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, marginTop: 18, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 12, overflow: "hidden" }}>
          {[["Ort", JOB.location], ["Tillträde", JOB.start], ["Anställning", JOB.employment], ["Lön", JOB.salaryNote]].map(([l, v], i) => (
            <div key={l} style={{ padding: "12px 14px", borderRight: i % 2 === 0 ? "1px solid var(--line)" : "none", borderBottom: i < 2 ? "1px solid var(--line)" : "none" }}>
              <div style={{ fontSize: 11, color: "var(--ink-500)", marginBottom: 3 }}>{l}</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-900)" }}>{v}</div>
            </div>
          ))}
        </div>

        <Section title="Om jobbet"><p style={{ fontSize: 14.5, color: "var(--ink-700)", lineHeight: 1.65, textWrap: "pretty" }}>{JOB.about}</p></Section>
        <Section title="Arbetsuppgifter"><Bullets items={JOB.tasks}/></Section>
        <Section title="Vi erbjuder"><Bullets items={JOB.offers} tone="success"/></Section>
      </div>
    </MobileShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
