<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Sveriges Transportplattform</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>

<style>
html { scroll-behavior: smooth; }
body { overflow-x: hidden; }
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
@keyframes rotateWord {
  0%, 30%   { opacity: 1; transform: translateY(0); }
  35%, 95%  { opacity: 0; transform: translateY(-12px); }
  100%      { opacity: 1; transform: translateY(0); }
}
.section {
  padding: 110px 32px;
}
.section-tight { padding: 80px 32px; }
@media (max-width: 900px) {
  .section { padding: 80px 24px; }
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  background: var(--amber-tint);
  color: var(--amber-text);
  border: 1px solid rgba(199,122,14,0.20);
}
.section-eyebrow {
  display: inline-block;
  padding: 4px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--green-text);
  background: var(--green-tint);
  margin-bottom: 18px;
}
h1.display {
  font-size: clamp(54px, 7.4vw, 108px);
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -3px;
  color: #fff;
  white-space: nowrap;
}
@media (max-width: 900px) {
  h1.display { white-space: normal; letter-spacing: -2px; }
}
h2.section-title {
  font-size: clamp(34px, 4vw, 54px);
  font-weight: 900;
  letter-spacing: -1.8px;
  line-height: 1.05;
  color: var(--ink-900);
  text-wrap: balance;
}
.lead {
  font-size: 18px;
  line-height: 1.7;
  color: var(--ink-500);
  font-weight: 500;
  text-wrap: pretty;
}
.container { max-width: 1200px; margin: 0 auto; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ════════════════════════════════════════════════
   NAV — fixed, transparent → white-on-scroll
════════════════════════════════════════════════ */
const Nav = () => {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 30);
    window.addEventListener("scroll", fn);
    fn();
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <nav style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
      background: scrolled ? "rgba(245,242,236,0.92)" : "transparent",
      borderBottom: scrolled ? "1px solid var(--line)" : "1px solid transparent",
      backdropFilter: scrolled ? "blur(12px)" : "none",
      WebkitBackdropFilter: scrolled ? "blur(12px)" : "none",
      transition: "background .25s, border-color .25s",
    }}>
      <div className="container" style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        height: 68, padding: "0 32px",
      }}>
        <a href="#top" style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{
            width: 30, height: 30, borderRadius: 7,
            background: "var(--green)", color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontWeight: 900, fontSize: 13,
            boxShadow: "inset 0 -2px 0 rgba(0,0,0,0.20)",
          }}>S</div>
          <span style={{
            fontWeight: 800, fontSize: 17,
            color: scrolled ? "var(--ink-900)" : "#fff",
            letterSpacing: 0.5,
            transition: "color .25s",
          }}>STP</span>
        </a>

        <div style={{ display: "flex", gap: 32, alignItems: "center" }}>
          {["För förare", "För åkerier", "Så fungerar det", "Om STP"].map(l => (
            <a key={l} href="#" style={{
              fontSize: 14, fontWeight: 500,
              color: scrolled ? "var(--ink-700)" : "rgba(255,255,255,0.82)",
              transition: "color .25s",
            }}>{l}</a>
          ))}
        </div>

        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <button style={{
            padding: "7px 14px", fontSize: 13.5, fontWeight: 600,
            color: scrolled ? "var(--ink-900)" : "#fff",
            transition: "color .25s",
          }}>Logga in</button>
          <Button variant="primary" size="sm">Kom igång</Button>
        </div>
      </div>
    </nav>
  );
};

/* ════════════════════════════════════════════════
   HERO
════════════════════════════════════════════════ */
const ROTATE = ["Förare.", "Åkeri.", "Match."];

const Hero = () => {
  const [idx, setIdx] = useState(0);
  const [visible, setVisible] = useState(true);
  useEffect(() => {
    const id = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setIdx(i => (i + 1) % ROTATE.length); setVisible(true); }, 250);
    }, 2600);
    return () => clearInterval(id);
  }, []);

  return (
    <section id="top" style={{
      background: "var(--ink-900)",
      backgroundImage: "url('hero.png')",
      backgroundSize: "cover",
      backgroundPosition: "center 55%",
      minHeight: "100vh",
      display: "flex", flexDirection: "column",
      paddingTop: 96, paddingBottom: 48,
      position: "relative",
      color: "#fff",
    }}>
      {/* Atmospheric overlay for legibility */}
      <div style={{
        position: "absolute", inset: 0,
        background: "linear-gradient(110deg, rgba(8,18,20,0.88) 0%, rgba(8,18,20,0.65) 40%, rgba(8,18,20,0.20) 75%, rgba(8,18,20,0.05) 100%)",
        pointerEvents: "none",
      }}/>

      <div className="container" style={{
        padding: "0 32px", width: "100%",
        display: "flex", flexDirection: "column",
        justifyContent: "center", flex: 1,
        position: "relative", zIndex: 1,
      }}>

        {/* Top row: eyebrow */}
        <div style={{
          display: "flex", alignItems: "center",
          marginBottom: 56,
        }}>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 8,
            padding: "6px 14px", borderRadius: 999,
            background: "rgba(245,166,35,0.15)",
            border: "1px solid rgba(245,166,35,0.35)",
            color: "#f5c875",
            fontSize: 11.5, fontWeight: 700,
            letterSpacing: 1.4, textTransform: "uppercase",
          }}>
            <Dot tone="amber" size={6}/>
            Beta · Gratis att använda
          </div>
        </div>

        {/* Massive single-line headline */}
        <h1 className="display" style={{ marginBottom: 28 }}>
          Rätt&nbsp;
          <span style={{
            color: "var(--amber)",
            display: "inline-block",
            minWidth: "3.2ch",
            opacity: visible ? 1 : 0,
            transform: visible ? "translateY(0)" : "translateY(8px)",
            transition: "opacity .25s ease, transform .25s ease",
          }}>{ROTATE[idx]}</span>
          &nbsp;<span style={{ color: "rgba(255,255,255,0.35)", fontWeight: 300 }}>Direkt.</span>
        </h1>

        {/* Lead under headline */}
        <p style={{
          fontSize: 19, lineHeight: 1.6,
          color: "rgba(255,255,255,0.78)", fontWeight: 500,
          textWrap: "pretty", marginBottom: 32, maxWidth: 580,
        }}>
          Sveriges matchningsplattform för yrkesförare och transportföretag.
          Inga mellanhänder. Inga avgifter. Inga generiska CV —
          bara körkort, certifikat och tillgänglighet.
        </p>

        {/* CTAs under lead, left-aligned */}
        <div style={{
          display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 72,
        }}>
          <button style={{
            display: "inline-flex", alignItems: "center", gap: 8,
            padding: "14px 24px", height: 50,
            background: "var(--amber)", color: "#fff",
            border: "1px solid var(--amber-deep)", borderRadius: 10,
            fontWeight: 700, fontSize: 15,
            boxShadow: "0 1px 0 var(--amber-deep), 0 4px 12px rgba(199,122,14,0.30)",
            cursor: "pointer", fontFamily: "var(--font)",
          }}>
            Se lediga jobb
            <Icon name="arrow" size={15} stroke={2.2}/>
          </button>
          <button style={{
            padding: "14px 24px", height: 50,
            background: "rgba(255,255,255,0.08)", color: "#fff",
            border: "1px solid rgba(255,255,255,0.22)", borderRadius: 10,
            fontWeight: 600, fontSize: 15,
            backdropFilter: "blur(6px)",
            WebkitBackdropFilter: "blur(6px)",
            cursor: "pointer", fontFamily: "var(--font)",
          }}>
            Jag är ett åkeri
          </button>
        </div>

        {/* Bottom strip: 4 data points — light text on dark */}
        <div style={{
          display: "grid", gridTemplateColumns: "repeat(4, 1fr)",
          gap: 0,
          borderTop: "1px solid rgba(255,255,255,0.14)",
          paddingTop: 28,
        }}>
          {[
            { value: "4 080", label: "Lediga tjänster",       mono: true },
            { value: "5 662", label: "Anställda i år",        mono: true },
            { value: "36 %",  label: "Åkerier saknar förare",  mono: true },
            { value: "Gratis", label: "För föraren — alltid",  mono: false, accent: true },
          ].map((s, i) => (
            <div key={s.label} style={{
              padding: i === 0 ? "0 28px 0 0" : "0 28px",
              borderLeft: i > 0 ? "1px solid rgba(255,255,255,0.10)" : "none",
            }}>
              <div style={{
                fontSize: 32, fontWeight: 800,
                color: s.accent ? "var(--amber)" : "#fff",
                letterSpacing: -0.8, lineHeight: 1.1, marginBottom: 8,
                fontFamily: s.mono ? "var(--mono)" : "var(--font)",
              }}>{s.value}</div>
              <div style={{
                fontSize: 11, color: "rgba(255,255,255,0.55)", fontWeight: 700,
                letterSpacing: 1.3, textTransform: "uppercase",
              }}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};

/* ════════════════════════════════════════════════
   LIVE MATCHNINGAR BAND — directly under hero, before marquee
════════════════════════════════════════════════ */
const LiveBand = () => {
  const matches = [
    { name: "Erik Lindström",  loc: "Malmö · Skåne",        lic: "CE · YKB",  pct: 94 },
    { name: "Sara Johansson",  loc: "Stockholm · Uppland",  lic: "C · ADR",   pct: 81 },
    { name: "Mikael Berg",     loc: "Göteborg · VG",        lic: "CE · CE95", pct: 76 },
  ];
  return (
    <section style={{ background: "var(--paper)", padding: "40px 32px 60px" }}>
      <div className="container">
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "baseline",
          marginBottom: 18, flexWrap: "wrap", gap: 12,
        }}>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 12 }}>
            <Pill tone="success" size="sm" icon={<Dot tone="success" size={6}/>}>Live</Pill>
            <span style={{
              fontSize: 11, fontWeight: 800, color: "var(--ink-500)",
              letterSpacing: 1.4, textTransform: "uppercase",
            }}>Nya matchningar senaste timmen</span>
          </div>
          <a href="#" style={{
            fontSize: 13, fontWeight: 700, color: "var(--green)",
            display: "inline-flex", alignItems: "center", gap: 6,
          }}>Se alla →</a>
        </div>

        <div style={{
          display: "grid",
          gridTemplateColumns: "repeat(3, 1fr) 1.1fr",
          gap: 14,
        }}>
          {matches.map(d => {
            const color = d.pct >= 90 ? "var(--success)" : d.pct >= 80 ? "var(--green)" : "var(--amber-deep)";
            return (
              <Card key={d.name} padding="18px 20px" style={{
                display: "flex", alignItems: "center", gap: 14,
              }}>
                <Avatar initials={d.name.split(" ").map(n => n[0]).join("")} size={42}/>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: "var(--ink-900)" }}>{d.name}</div>
                  <div style={{ fontSize: 12.5, color: "var(--ink-500)", marginTop: 2 }}>{d.loc}</div>
                  <div style={{
                    fontSize: 11.5, color: "var(--ink-500)", marginTop: 6,
                    fontFamily: "var(--mono)", fontWeight: 600,
                  }}>{d.lic}</div>
                </div>
                <div style={{
                  fontSize: 19, fontWeight: 800, color, flexShrink: 0,
                  fontFamily: "var(--mono)",
                }}>{d.pct}%</div>
              </Card>
            );
          })}

          {/* Bärnsten stat callout — 4th cell in the row */}
          <div style={{
            background: "var(--amber)",
            borderRadius: "var(--r-lg)",
            padding: "18px 22px",
            display: "flex", flexDirection: "column", justifyContent: "center",
            color: "#fff",
            boxShadow: "0 4px 14px rgba(199,122,14,0.22)",
          }}>
            <div style={{
              fontSize: 30, fontWeight: 900, lineHeight: 1,
              letterSpacing: -1, marginBottom: 6,
            }}>5 662</div>
            <div style={{ fontSize: 12.5, lineHeight: 1.45, fontWeight: 500, opacity: 0.95 }}>
              Förare nyanställda<br/>senaste 12 månaderna
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

/* ════════════════════════════════════════════════
   STATS MARQUEE
════════════════════════════════════════════════ */
const Marquee = () => {
  const items = [
    "4 080 nya tjänster att tillsätta",
    "Inga mellanhänder",
    "Inga avgifter",
    "Matchning baserat på körkort & kompetens",
    "Verifierade åkerier",
    "Välkomnad av Transportföretagen & SÅ",
    "Gratis för alla förare",
    "Beta-plattform i aktiv utveckling",
  ];
  const all = [...items, ...items];
  return (
    <div style={{
      background: "var(--ink-900)",
      borderTop: "1px solid #000", borderBottom: "1px solid #000",
      padding: "18px 0", overflow: "hidden",
    }}>
      <div style={{
        display: "flex", animation: "marquee 38s linear infinite",
        width: "max-content",
      }}>
        {all.map((it, i) => (
          <span key={i} style={{
            flexShrink: 0, padding: "0 36px",
            fontSize: 13, fontWeight: 600,
            color: "rgba(232,237,237,0.75)",
            display: "inline-flex", alignItems: "center", gap: 36,
          }}>
            {it}
            <span style={{ color: "var(--amber)", fontSize: 8 }}>●</span>
          </span>
        ))}
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════
   PROBLEM
════════════════════════════════════════════════ */
const Problem = () => (
  <section className="section" style={{ background: "var(--paper)" }}>
    <div className="container">
      <div style={{ maxWidth: 620, marginBottom: 64 }}>
        <span className="section-eyebrow">Bakgrund</span>
        <h2 className="section-title" style={{ marginBottom: 20 }}>
          Branschen förtjänar bättre.
        </h2>
        <p className="lead">
          Idag matchas förare och åkerier via Facebook-grupper, generiska
          jobbsajter och bemanningsbolag som tar en del av lönen.
          Det behöver inte vara så.
        </p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 18 }}>
        {[
          { no: "01", title: "Ingen struktur",       body: "Körkort, erfarenhet och tillgänglighet begrävs i fritext och kommentarsfält. Ingen vet vem som är seriös." },
          { no: "02", title: "Mellanhänder äter lönen", body: "Bemanningsbolag tar mellan 25–40 % av lönen. Föraren förlorar. Åkeriet betalar mer. Ingen vinner." },
          { no: "03", title: "Bra kandidater försvinner", body: "En jobbannons lever 24 timmar på sociala medier. Rätt förare ser den aldrig. Åkeriet upprepar processen." },
        ].map(p => (
          <Card key={p.no} padding="36px 32px" style={{ position: "relative" }}>
            <div style={{
              fontSize: 13, fontWeight: 800, color: "var(--green)",
              letterSpacing: 2, marginBottom: 22,
              fontFamily: "var(--mono)",
            }}>{p.no}</div>
            <h3 style={{
              fontSize: 22, fontWeight: 800, color: "var(--ink-900)",
              marginBottom: 14, letterSpacing: -0.5, lineHeight: 1.2,
            }}>{p.title}</h3>
            <p style={{
              fontSize: 14.5, color: "var(--ink-500)",
              lineHeight: 1.7, textWrap: "pretty",
            }}>{p.body}</p>
          </Card>
        ))}
      </div>
    </div>
  </section>
);

/* ════════════════════════════════════════════════
   IDENTITY — what STP is and isn't (paired with Problem)
════════════════════════════════════════════════ */
const Identity = () => {
  const isItems = [
    "En direkt matchningsplattform mellan förare och åkerier",
    "Strukturerad på körkort, certifikat, region och tillgänglighet",
    "Verifierade åkerier (mot Bolagsverket)",
    "Gratis under hela betafasen — inga dölda kostnader",
    "Du styr själv din synlighet och vad som visas",
  ];
  const isntItems = [
    "Ett bemanningsbolag som tar provision på din lön",
    "En generisk jobbsöksajt med fritext-CV",
    "En Facebook-grupp där annonser försvinner på 24 timmar",
    "En mellanhand mellan dig och din nästa arbetsgivare",
    "En plats för ogrundade arbetsgivare eller oseriösa aktörer",
  ];
  return (
    <section className="section" style={{ background: "var(--paper-2)" }}>
      <div className="container">
        <div style={{ marginBottom: 56, maxWidth: 720 }}>
          <span className="section-eyebrow">Vad är STP</span>
          <h2 className="section-title" style={{ marginBottom: 20 }}>
            En tydlig plattform.<br/>Ingen otydlig mellanhand.
          </h2>
          <p className="lead">
            En enkel definition gör det lättare att veta om STP är för dig.
          </p>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
          {/* STP är */}
          <Card padding="30px 32px">
            <div style={{
              display: "flex", alignItems: "center", gap: 12, marginBottom: 22,
              paddingBottom: 18, borderBottom: "1px solid var(--line)",
            }}>
              <span style={{
                width: 34, height: 34, borderRadius: 10,
                background: "var(--green-tint)",
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0,
              }}>
                <Icon name="check" size={17} color="var(--green-text)" stroke={2.6}/>
              </span>
              <h3 style={{
                fontSize: 22, fontWeight: 800, color: "var(--ink-900)",
                letterSpacing: -0.5,
              }}>STP <span style={{ color: "var(--green)" }}>är</span></h3>
            </div>
            <ul style={{ display: "flex", flexDirection: "column", gap: 14, listStyle: "none" }}>
              {isItems.map(it => (
                <li key={it} style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <span style={{
                    width: 20, height: 20, borderRadius: 10,
                    background: "var(--success-tint)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    flexShrink: 0, marginTop: 1,
                  }}>
                    <Icon name="check" size={11} color="var(--success)" stroke={3}/>
                  </span>
                  <span style={{
                    fontSize: 14.5, color: "var(--ink-700)",
                    lineHeight: 1.6, fontWeight: 500, textWrap: "pretty",
                  }}>{it}</span>
                </li>
              ))}
            </ul>
          </Card>

          {/* STP är inte */}
          <Card padding="30px 32px">
            <div style={{
              display: "flex", alignItems: "center", gap: 12, marginBottom: 22,
              paddingBottom: 18, borderBottom: "1px solid var(--line)",
            }}>
              <span style={{
                width: 34, height: 34, borderRadius: 10,
                background: "var(--danger-tint)",
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0,
              }}>
                <Icon name="x" size={16} color="var(--danger)" stroke={2.6}/>
              </span>
              <h3 style={{
                fontSize: 22, fontWeight: 800, color: "var(--ink-900)",
                letterSpacing: -0.5,
              }}>STP är <span style={{ color: "var(--danger)" }}>inte</span></h3>
            </div>
            <ul style={{ display: "flex", flexDirection: "column", gap: 14, listStyle: "none" }}>
              {isntItems.map(it => (
                <li key={it} style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <span style={{
                    width: 20, height: 20, borderRadius: 10,
                    background: "var(--danger-tint)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    flexShrink: 0, marginTop: 1,
                  }}>
                    <Icon name="x" size={11} color="var(--danger)" stroke={3}/>
                  </span>
                  <span style={{
                    fontSize: 14.5, color: "var(--ink-700)",
                    lineHeight: 1.6, fontWeight: 500, textWrap: "pretty",
                  }}>{it}</span>
                </li>
              ))}
            </ul>
          </Card>
        </div>
      </div>
    </section>
  );
};

/* ════════════════════════════════════════════════
   SOLUTION
════════════════════════════════════════════════ */
const Solution = () => (
  <section className="section" style={{ background: "var(--paper)" }}>
    <div className="container">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.15fr", gap: 80, alignItems: "start" }}>
        <div style={{ position: "sticky", top: 100 }}>
          <span className="section-eyebrow">Lösningen</span>
          <h2 className="section-title" style={{ marginBottom: 22 }}>
            En samlande plattform för hela branschen.
          </h2>
          <p className="lead" style={{ marginBottom: 36 }}>
            STP samlar förare och åkerier i en transparent och
