<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Jobb (mobil)</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const JOBS = [
  { id:1, title:"CE-chaufför fjärrkörning", company:"Nordic Transport AB", logo:"NT", loc:"Malmö",       salary:"36 000–42 000 kr", license:"CE", type:"Fast",     match:94, verified:true,  posted:"2 dgr" },
  { id:2, title:"C-chaufför distribution",  company:"Stockholm Logistik",  logo:"SL", loc:"Stockholm",   salary:"29 000 kr/mån",    license:"C",  type:"Fast",     match:81, verified:true,  posted:"3 dgr" },
  { id:3, title:"CE-chaufför vikariat",     company:"Transport Syd",       logo:"TS", loc:"Helsingborg", salary:"350 kr/tim",       license:"CE", type:"Vikariat", match:76, verified:false, posted:"4 dgr" },
  { id:4, title:"Tankbilschaufför ADR",     company:"PetrolTrans Nordic",  logo:"PT", loc:"Göteborg",    salary:"Enligt koll. + OB",license:"CE", type:"Fast",     match:68, verified:true,  posted:"5 dgr" },
];

const matchColor = (m) => m >= 90 ? "var(--success)" : m >= 80 ? "var(--green)" : m >= 70 ? "var(--amber-deep)" : "var(--ink-500)";

const JobCard = ({ j, saved, onSave }) => (
  <article style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: "16px 16px", boxShadow: "var(--sh-sm)" }}>
    <div style={{ display: "flex", gap: 12, alignItems: "flex-start", marginBottom: 12 }}>
      <div style={{ width: 44, height: 44, borderRadius: 11, background: "var(--paper-2)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13.5, fontWeight: 800, color: "var(--ink-700)", flexShrink: 0 }}>{j.logo}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <h3 style={{ fontSize: 15.5, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.2, lineHeight: 1.3, marginBottom: 3 }}>{j.title}</h3>
        <div style={{ fontSize: 13, color: "var(--ink-500)", display: "flex", alignItems: "center", gap: 5 }}>
          {j.company}{j.verified && <Icon name="check" size={11} color="var(--success)" stroke={3}/>}
        </div>
      </div>
      <button onClick={() => onSave(j.id)} style={{ width: 34, height: 34, borderRadius: 9, background: saved ? "var(--amber-tint)" : "var(--card-2)", border: `1px solid ${saved ? "rgba(199,122,14,0.3)" : "var(--line-2)"}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
        <Icon name="heart" size={15} color={saved ? "var(--amber-deep)" : "var(--ink-400)"} stroke={saved ? 0 : 2}/>
      </button>
    </div>
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
      <Pill tone="primary" size="sm">{j.license}</Pill>
      <Pill tone="neutral" size="sm">{j.type}</Pill>
      <Pill tone="soft" size="sm" icon={<Icon name="pin" size={10} color="var(--green-text)" stroke={1.8}/>}>{j.loc}</Pill>
    </div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 12, borderTop: "1px solid var(--line)" }}>
      <div style={{ fontSize: 13.5, fontWeight: 700, color: "var(--ink-900)", fontFamily: "var(--mono)" }}>{j.salary}</div>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "4px 10px", borderRadius: 999, background: j.match >= 85 ? "var(--success-tint)" : "var(--green-tint)" }}>
        <span style={{ fontSize: 13, fontWeight: 800, fontFamily: "var(--mono)", color: matchColor(j.match) }}>{j.match}%</span>
      </span>
    </div>
  </article>
);

const Header = () => (
  <div style={{ background: "var(--paper)", padding: "6px 18px 14px" }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
      <h1 style={{ fontSize: 26, fontWeight: 900, color: "var(--ink-900)", letterSpacing: -1 }}>Lediga jobb</h1>
      <div style={{ width: 38, height: 38, borderRadius: "50%", background: "var(--green)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 13 }}>OH</div>
    </div>
    <div style={{ position: "relative" }}>
      <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: "var(--ink-400)" }}><Icon name="search" size={16} stroke={2}/></span>
      <input placeholder="Sök jobb, ort, företag..." style={{ width: "100%", padding: "12px 14px 12px 42px", background: "var(--card)", border: "1px solid var(--line-2)", borderRadius: 12, fontSize: 14.5, color: "var(--ink-900)", outline: "none", boxShadow: "var(--sh-sm)", fontFamily: "var(--font)" }}/>
    </div>
  </div>
);

const App = () => {
  const [tab, setTab] = useState("jobb");
  const [saved, setSaved] = useState(new Set([1]));
  const toggle = id => setSaved(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

  return (
    <MobileShell tabs={DRIVER_TABS} active={tab} onTab={setTab} header={<Header/>}>
      <div style={{ padding: "4px 16px 24px" }}>
        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 14, marginBottom: 4 }}>
          {["Alla", "CE", "Fast tjänst", "Skåne", "Vikariat"].map((f, i) => (
            <button key={f} style={{ flexShrink: 0, padding: "7px 14px", borderRadius: 999, fontSize: 13, fontWeight: 600, background: i === 0 ? "var(--green)" : "var(--card)", color: i === 0 ? "#fff" : "var(--ink-700)", border: `1px solid ${i === 0 ? "var(--green-deep)" : "var(--line-2)"}`, boxShadow: "var(--sh-sm)" }}>{f}</button>
          ))}
        </div>
        <div style={{ fontSize: 12.5, color: "var(--ink-500)", fontWeight: 600, marginBottom: 12 }}>{JOBS.length} jobb matchar din profil</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {JOBS.map(j => <JobCard key={j.id} j={j} saved={saved.has(j.id)} onSave={toggle}/>)}
        </div>
      </div>
    </MobileShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
