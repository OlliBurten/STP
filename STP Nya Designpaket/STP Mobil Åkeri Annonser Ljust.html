<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Annonser (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const JOBS = [
  { id:0, title:"CE-chaufför fjärrkörning", loc:"Malmö", status:"active", applicants:12, new:3, contacted:4, interviewed:2, hired:0, hot:true },
  { id:1, title:"Distributionschaufför", loc:"Stockholm", status:"active", applicants:8, new:2, contacted:3, interviewed:1, hired:0 },
  { id:2, title:"Tankbilschaufför ADR", loc:"Malmö", status:"active", applicants:6, new:2, contacted:1, interviewed:0, hired:0, hot:true },
  { id:3, title:"Lokal CE-tjänst", loc:"Göteborg", status:"active", applicants:4, new:0, contacted:2, interviewed:1, hired:0, low:true },
  { id:4, title:"Helgchaufför", loc:"Lund", status:"paused", applicants:2, new:0, contacted:0, interviewed:0, hired:0 },
];
const stMeta = { active:{label:"Aktiv",tone:"success"}, paused:{label:"Pausad",tone:"amber"}, closed:{label:"Stängd",tone:"neutral"} };

const App = () => {
  const [tab, setTab] = useState("annonser");
  const [f, setF] = useState("active");
  const filters = [["active","Aktiva"],["paused","Pausade"],["all","Alla"]];
  const list = JOBS.filter(j => f === "all" ? true : j.status === f);
  return (
    <MobileShell tabs={COMPANY_TABS} active={tab} onTab={setTab}
      header={<div style={{ background:"var(--paper)", padding:"6px 18px 12px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <h1 style={{ fontSize:24, fontWeight:900, color:"var(--ink-900)", letterSpacing:-0.8 }}>Annonser</h1>
        <button style={{ width:40, height:40, borderRadius:12, background:"var(--green)", border:"1px solid var(--green-deep)", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"var(--sh-sm)" }}><Icon name="plus" size={18} color="#fff" stroke={2.4}/></button>
      </div>}>
      <div style={{ padding:"0 16px 24px" }}>
        <div style={{ display:"flex", gap:8, paddingBottom:14 }}>
          {filters.map(([k,l]) => <button key={k} onClick={() => setF(k)} style={{ padding:"7px 14px", borderRadius:999, fontSize:13, fontWeight:600, background:f===k?"var(--green)":"var(--card)", color:f===k?"#fff":"var(--ink-700)", border:`1px solid ${f===k?"var(--green-deep)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}>{l}</button>)}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {list.map(j => {
            const meta = stMeta[j.status];
            return (
              <div key={j.id} style={{ background:j.low?"var(--amber-tint)":"var(--card)", border:`1px solid ${j.low?"rgba(199,122,14,0.22)":"var(--line)"}`, borderRadius:16, padding:16, boxShadow:"var(--sh-sm)" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, marginBottom:12 }}>
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:3 }}>
                      <span style={{ fontSize:15, fontWeight:800, color:"var(--ink-900)" }}>{j.title}</span>
                      {j.hot && <Pill tone="amberSolid" size="sm">HOT</Pill>}
                    </div>
                    <div style={{ fontSize:12.5, color:"var(--ink-500)" }}>{j.loc}</div>
                  </div>
                  <Pill tone={meta.tone} size="sm">{meta.label}</Pill>
                </div>
                {j.low && <div style={{ fontSize:12, color:"var(--amber-deep)", fontWeight:600, marginBottom:10, display:"flex", alignItems:"center", gap:6 }}><Icon name="alert" size={12} color="var(--amber-deep)" stroke={2.2}/>Behöver attention — låg trafik</div>}
                <div style={{ display:"flex", gap:6 }}>
                  {[["Sökande",j.applicants],["Kontakt.",j.contacted],["Intervju",j.interviewed],["Anställd",j.hired]].map(([l,v]) => (
                    <div key={l} style={{ flex:1, background:"var(--card-2)", border:"1px solid var(--line)", borderRadius:9, padding:"8px 4px", textAlign:"center" }}>
                      <div style={{ fontSize:16, fontWeight:800, color:v>0?"var(--ink-900)":"var(--ink-300)", fontFamily:"var(--mono)", lineHeight:1 }}>{v}</div>
                      <div style={{ fontSize:9, color:"var(--ink-500)", marginTop:4, fontWeight:600, textTransform:"uppercase", letterSpacing:0.2 }}>{l}</div>
                    </div>
                  ))}
                </div>
                {j.new > 0 && <div style={{ marginTop:12 }}><Button variant="primary" size="sm" full iconRight={<Icon name="arrow" size={12} stroke={2.2}/>}>{j.new} nya ansökningar att granska</Button></div>}
              </div>
            );
          })}
        </div>
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
