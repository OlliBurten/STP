<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Åkerier (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const COMPANIES = [
  { id:1, name:"Nordic Transport AB", logo:"NT", loc:"Malmö, Skåne", verified:true, rating:4.7, openJobs:5, segs:["Fjärr"] },
  { id:2, name:"Stockholm Logistik AB", logo:"SL", loc:"Stockholm", verified:true, rating:4.5, openJobs:8, segs:["Distribution"] },
  { id:3, name:"PetrolTrans Nordic", logo:"PT", loc:"Göteborg", verified:true, rating:4.3, openJobs:2, segs:["Tank"] },
  { id:4, name:"Norrlands Skogsfrakt", logo:"NS", loc:"Umeå", verified:true, rating:4.8, openJobs:4, segs:["Skog"] },
];

const App = () => {
  const [tab, setTab] = useState("akerier");
  return (
    <MobileShell tabs={DRIVER_TABS} active={tab} onTab={setTab}
      header={<div style={{ background:"var(--paper)", padding:"6px 18px 14px" }}>
        <h1 style={{ fontSize:24, fontWeight:900, color:"var(--ink-900)", letterSpacing:-0.8, marginBottom:12 }}>Åkerier</h1>
        <div style={{ position:"relative" }}><span style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)", color:"var(--ink-400)" }}><Icon name="search" size={16} stroke={2}/></span><input placeholder="Sök åkeri eller ort..." style={{ width:"100%", padding:"11px 14px 11px 42px", background:"var(--card)", border:"1px solid var(--line-2)", borderRadius:12, fontSize:14, color:"var(--ink-900)", outline:"none", boxShadow:"var(--sh-sm)", fontFamily:"var(--font)" }}/></div>
      </div>}>
      <div style={{ padding:"4px 16px 24px", display:"flex", flexDirection:"column", gap:12 }}>
        {COMPANIES.map(c => (
          <div key={c.id} style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:16, padding:16, boxShadow:"var(--sh-sm)" }}>
            <div style={{ display:"flex", gap:13, alignItems:"center" }}>
              <div style={{ width:50, height:50, borderRadius:12, background:"var(--paper-2)", border:"1px solid var(--line)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:800, color:"var(--ink-700)", flexShrink:0 }}>{c.logo}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:6 }}><span style={{ fontSize:15, fontWeight:800, color:"var(--ink-900)" }}>{c.name}</span>{c.verified && <Icon name="check" size={11} color="var(--success)" stroke={3}/>}</div>
                <div style={{ fontSize:12.5, color:"var(--ink-500)", marginTop:2, display:"flex", alignItems:"center", gap:6 }}><Icon name="star" size={11} color="var(--amber)" stroke={0}/>{c.rating} · {c.loc}</div>
              </div>
              <button style={{ width:32, height:32, borderRadius:8, background:"var(--card-2)", border:"1px solid var(--line-2)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name="heart" size={14} color="var(--ink-400)" stroke={2}/></button>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:14, paddingTop:14, borderTop:"1px solid var(--line)" }}>
              <span style={{ fontSize:13, fontWeight:700, color:c.openJobs>0?"var(--green-text)":"var(--ink-400)" }}>{c.openJobs} lediga jobb</span>
              <Button variant="primary" size="sm" iconRight={<Icon name="arrow" size={12} stroke={2.2}/>}>Se jobb</Button>
            </div>
          </div>
        ))}
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
