<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Åkeri kom igång (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const STEPS = ["Företag", "Inriktning", "Region"];
const SEGS = [["fjarr","truck","Fjärr"],["dist","building","Distribution"],["tank","alert","Tank & ADR"],["bygg","settings","Bygg"],["skog","info","Skog"],["spec","star","Special"]];
const REGIONS = ["Skåne","Stockholm","V. Götaland","Halland","Norrbotten","Uppsala"];

const App = () => {
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(false);
  const [org, setOrg] = useState("");
  const [fetched, setFetched] = useState(false);
  const [segs, setSegs] = useState([]);
  const [regions, setRegions] = useState([]);
  const tog = (arr,set,v) => set(arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]);
  const canNext = step===0 ? fetched : step===1 ? segs.length>0 : regions.length>0;

  if (done) return (
    <MobileShell noTabs>
      <div style={{ padding:"50px 24px", textAlign:"center", display:"flex", flexDirection:"column", alignItems:"center" }}>
        <div style={{ width:76, height:76, borderRadius:38, background:"var(--success-tint)", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:22 }}><Icon name="check" size={34} color="var(--success)" stroke={3}/></div>
        <h1 style={{ fontSize:24, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:10 }}>Kontot är skapat!</h1>
        <p style={{ fontSize:14.5, color:"var(--ink-500)", lineHeight:1.6, marginBottom:28 }}>Publicera er första annons och börja matchas mot förare direkt.</p>
        <Button variant="primary" size="lg" full iconRight={<Icon name="arrow" size={15} stroke={2.2}/>}>Publicera första annonsen</Button>
      </div>
    </MobileShell>
  );

  return (
    <MobileShell noTabs footer={
      <div style={{ background:"var(--card)", borderTop:"1px solid var(--line)", padding:"12px 16px 24px", display:"flex", gap:10 }}>
        {step>0 && <Button variant="secondary" size="lg" onClick={() => setStep(step-1)} icon={<Icon name="arrowLeft" size={14} stroke={2}/>}>Bakåt</Button>}
        <Button variant="primary" size="lg" onClick={() => step<STEPS.length-1?setStep(step+1):setDone(true)} disabled={!canNext} iconRight={<Icon name="arrow" size={15} stroke={2.2}/>} style={{ flex:1 }}>{step<STEPS.length-1?"Fortsätt":"Skapa konto"}</Button>
      </div>
    }>
      <div style={{ padding:"12px 20px 24px" }}>
        <div style={{ display:"flex", gap:6, marginBottom:8 }}>{STEPS.map((s,i) => <div key={i} style={{ height:4, flex:1, borderRadius:2, background:i<=step?"var(--green)":"var(--line-2)" }}/>)}</div>
        <div style={{ fontSize:12.5, color:"var(--ink-500)", fontWeight:600, marginBottom:28 }}>Steg {step+1} av {STEPS.length} · {STEPS[step]}</div>

        {step===0 && (<div>
          <h1 style={{ fontSize:23, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:8 }}>Ert företag</h1>
          <p style={{ fontSize:14, color:"var(--ink-500)", marginBottom:22 }}>Vi hämtar uppgifter från Bolagsverket.</p>
          <div style={{ fontSize:13, fontWeight:700, color:"var(--ink-700)", marginBottom:8 }}>Organisationsnummer</div>
          <div style={{ display:"flex", gap:10, marginBottom:18 }}>
            <input value={org} onChange={e=>{setOrg(e.target.value);setFetched(false);}} placeholder="556677-8899" style={{ flex:1, padding:"13px 16px", borderRadius:12, background:"var(--card)", border:"1px solid var(--line-2)", fontSize:15, color:"var(--ink-900)", outline:"none", fontFamily:"var(--mono)", boxShadow:"var(--sh-sm)" }}/>
            <Button variant="secondary" size="lg" onClick={() => org.length>=6 && setFetched(true)}>Hämta</Button>
          </div>
          {fetched && (
            <div style={{ background:"var(--green-tint)", border:"1px solid var(--green-tint-2)", borderRadius:14, padding:"16px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}><Icon name="check" size={15} color="var(--success)" stroke={3}/><span style={{ fontSize:13, fontWeight:700, color:"var(--success)" }}>Hittat hos Bolagsverket</span></div>
              {[["Namn","Nordic Transport AB"],["Säte","Malmö, Skåne"],["Status","Aktivt · F-skatt"]].map(([l,v]) => <div key={l} style={{ display:"flex", justifyContent:"space-between", padding:"6px 0", fontSize:13.5 }}><span style={{ color:"var(--ink-500)" }}>{l}</span><span style={{ color:"var(--ink-900)", fontWeight:600 }}>{v}</span></div>)}
            </div>
          )}
        </div>)}

        {step===1 && (<div>
          <h1 style={{ fontSize:23, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:8 }}>Vad kör ni?</h1>
          <p style={{ fontSize:14, color:"var(--ink-500)", marginBottom:22 }}>Välj era inriktningar.</p>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {SEGS.map(([v,ic,l]) => { const sel=segs.includes(v); return <button key={v} onClick={() => tog(segs,setSegs,v)} style={{ display:"flex", gap:11, alignItems:"center", padding:"15px 14px", borderRadius:12, textAlign:"left", background:sel?"var(--green-tint)":"var(--card)", border:`1.5px solid ${sel?"var(--green)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}><span style={{ width:36, height:36, borderRadius:9, background:sel?"var(--green)":"var(--green-tint)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name={ic} size={16} color={sel?"#fff":"var(--green-text)"} stroke={2}/></span><span style={{ fontSize:13.5, fontWeight:700, color:"var(--ink-900)" }}>{l}</span></button>; })}
          </div>
        </div>)}

        {step===2 && (<div>
          <h1 style={{ fontSize:23, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:8 }}>Var verkar ni?</h1>
          <p style={{ fontSize:14, color:"var(--ink-500)", marginBottom:22 }}>Så vi visar er för rätt förare.</p>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>{REGIONS.map(r => { const sel=regions.includes(r); return <button key={r} onClick={() => tog(regions,setRegions,r)} style={{ padding:"10px 16px", borderRadius:999, fontSize:13.5, fontWeight:600, background:sel?"var(--green)":"var(--card)", color:sel?"#fff":"var(--ink-700)", border:`1px solid ${sel?"var(--green-deep)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}>{r}</button>; })}</div>
        </div>)}
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
