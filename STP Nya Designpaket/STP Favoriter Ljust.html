<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Sparat</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>

<style>
  .fav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 760px) { .fav-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ════════════════════════════════════════════════
   DATA
════════════════════════════════════════════════ */
const FAV_JOBS = [
  { id:1, title:"CE-chaufför fjärrkörning",   company:"Nordic Transport AB", logo:"NT", location:"Malmö",       salary:"36 000 – 42 000 kr/mån", license:"CE", employment:"Fast",     match:94, savedAt:"2 dgr sen",   verified:true },
  { id:2, title:"CE-chaufför tempererat",     company:"Nordic Transport AB", logo:"NT", location:"Helsingborg", salary:"35 000 – 39 000 kr/mån", license:"CE", employment:"Fast",     match:88, savedAt:"4 dgr sen",   verified:true },
  { id:3, title:"CE-chaufför tanktransporter",company:"PetrolTrans Nordic",  logo:"PT", location:"Göteborg",    salary:"Enligt koll. + OB",      license:"CE", employment:"Fast",     match:68, savedAt:"1 vecka sen", verified:true },
  { id:4, title:"C-chaufför distribution",    company:"Stockholm Logistik",  logo:"SL", location:"Stockholm",   salary:"29 000 – 32 000 kr/mån", license:"C",  employment:"Fast",     match:62, savedAt:"1 vecka sen", verified:true },
  { id:5, title:"Lokalchaufför Borås",        company:"Sydtransport AB",     logo:"ST", location:"Borås",       salary:"30 500 kr/mån",          license:"C",  employment:"Fast",     match:58, savedAt:"2 veckor sen",verified:false },
];

const FAV_COMPANIES = [
  { id:1, name:"Nordic Transport AB", logo:"NT", location:"Malmö, Skåne",                openJobs:3, rating:4.3, reviews:12, kollektivavtal:true, savedAt:"1 vecka sen" },
  { id:2, name:"Junosuando Åkeri",    logo:"JÅ", location:"Junosuando, Norrbotten",      openJobs:1, rating:4.6, reviews:3,  kollektivavtal:true, savedAt:"2 veckor sen" },
  { id:3, name:"PetrolTrans Nordic",  logo:"PT", location:"Göteborg, Västra Götaland",   openJobs:0, rating:4.1, reviews:8,  kollektivavtal:true, savedAt:"3 veckor sen" },
];

const NAV_ITEMS = [
  { id: "jobb",        label: "Jobb" },
  { id: "ansokningar", label: "Mina ansökningar" },
  { id: "meddelanden", label: "Meddelanden", badge: 1 },
  { id: "favoriter",   label: "Favoriter" },
];
const ME = { initials: "OH", label: "Oliver Harburt" };

const StarRow = ({ rating }) => {
  const full = Math.floor(rating);
  return (
    <span style={{ display: "inline-flex", gap: 2, alignItems: "center" }}>
      {[1,2,3,4,5].map(i => <Icon key={i} name="star" size={12} color={i <= full ? "var(--amber)" : "var(--ink-200)"} stroke={0}/>)}
    </span>
  );
};

/* ════════════════════════════════════════════════
   JOB CARD
════════════════════════════════════════════════ */
const JobCard = ({ job, onRemove }) => (
  <article style={{
    background: "var(--card)", border: "1px solid var(--line)",
    borderRadius: "var(--r-lg)", padding: "20px 22px", boxShadow: "var(--sh-sm)",
    transition: "box-shadow .15s, border-color .15s", cursor: "pointer",
  }}
  onMouseEnter={e => { e.currentTarget.style.boxShadow = "var(--sh)"; e.currentTarget.style.borderColor = "var(--line-2)"; }}
  onMouseLeave={e => { e.currentTarget.style.boxShadow = "var(--sh-sm)"; e.currentTarget.style.borderColor = "var(--line)"; }}
  >
    <div style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 14 }}>
      <div style={{
        width: 46, height: 46, borderRadius: 11, flexShrink: 0,
        background: "var(--paper-2)", border: "1px solid var(--line)",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 14, fontWeight: 800, color: "var(--ink-700)",
      }}>{job.logo}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <h3 style={{ fontSize: 16, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.3, lineHeight: 1.3 }}>{job.title}</h3>
          <button onClick={(e) => { e.stopPropagation(); onRemove(job.id); }} style={{
            width: 32, height: 32, borderRadius: 8, flexShrink: 0,
            background: "var(--amber-tint)", border: "1px solid rgba(199,122,14,0.3)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }} title="Ta bort från sparat">
            <Icon name="heart" size={14} color="var(--amber-deep)" stroke={0}/>
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 3, fontSize: 13, color: "var(--ink-500)" }}>
          <span style={{ fontWeight: 600, color: "var(--ink-700)" }}>{job.company}</span>
          {job.verified && <Icon name="check" size={11} color="var(--success)" stroke={3}/>}
          <span>· {job.location}</span>
        </div>
      </div>
    </div>

    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
      <Pill tone="primary" size="sm">{job.license}</Pill>
      <Pill tone="neutral" size="sm">{job.employment}</Pill>
      <Pill tone="soft" size="sm" icon={<Icon name="pin" size={10} color="var(--green-text)" stroke={1.8}/>}>{job.location}</Pill>
    </div>

    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 14, borderTop: "1px solid var(--line)" }}>
      <div>
        <div style={{ fontSize: 13.5, fontWeight: 700, color: "var(--ink-900)", fontFamily: "var(--mono)" }}>{job.salary}</div>
        <div style={{ fontSize: 11.5, color: "var(--ink-400)", marginTop: 2 }}>Sparad {job.savedAt}</div>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <span style={{
          display: "inline-flex", alignItems: "center", gap: 5, padding: "4px 10px", borderRadius: 999,
          background: job.match >= 85 ? "var(--success-tint)" : "var(--green-tint)",
          fontSize: 13, fontWeight: 800, fontFamily: "var(--mono)",
          color: job.match >= 85 ? "var(--success)" : "var(--green-text)",
        }}>{job.match}%</span>
        <Button variant="primary" size="sm">Ansök</Button>
      </div>
    </div>
  </article>
);

/* ════════════════════════════════════════════════
   COMPANY CARD
════════════════════════════════════════════════ */
const CompanyCard = ({ c, onRemove }) => (
  <article style={{
    background: "var(--card)", border: "1px solid var(--line)",
    borderRadius: "var(--r-lg)", padding: "20px 22px", boxShadow: "var(--sh-sm)",
    transition: "box-shadow .15s, border-color .15s", cursor: "pointer",
  }}
  onMouseEnter={e => { e.currentTarget.style.boxShadow = "var(--sh)"; e.currentTarget.style.borderColor = "var(--line-2)"; }}
  onMouseLeave={e => { e.currentTarget.style.boxShadow = "var(--sh-sm)"; e.currentTarget.style.borderColor = "var(--line)"; }}
  >
    <div style={{ display: "flex", gap: 14, alignItems: "flex-start" }}>
      <div style={{
        width: 52, height: 52, borderRadius: 12, flexShrink: 0,
        background: "var(--paper-2)", border: "1px solid var(--line)",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 16, fontWeight: 800, color: "var(--ink-700)",
      }}>{c.logo}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div>
            <h3 style={{ fontSize: 16, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.3 }}>{c.name}</h3>
            <div style={{ fontSize: 13, color: "var(--ink-500)", marginTop: 2 }}>{c.location}</div>
          </div>
          <button onClick={(e) => { e.stopPropagation(); onRemove(c.id); }} style={{
            width: 32, height: 32, borderRadius: 8, flexShrink: 0,
            background: "var(--amber-tint)", border: "1px solid rgba(199,122,14,0.3)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }} title="Ta bort från sparat">
            <Icon name="heart" size={14} color="var(--amber-deep)" stroke={0}/>
          </button>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 12, flexWrap: "wrap" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
            <StarRow rating={c.rating}/>
            <span style={{ fontSize: 13, color: "var(--ink-700)", fontWeight: 600 }}>{c.rating}</span>
            <span style={{ fontSize: 12, color: "var(--ink-400)" }}>({c.reviews})</span>
          </span>
          {c.kollektivavtal && <Pill tone="info" size="sm">Kollektivavtal</Pill>}
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--line)" }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: c.openJobs > 0 ? "var(--green-text)" : "var(--ink-400)" }}>
            {c.openJobs > 0 ? `${c.openJobs} lediga jobb` : "Inga lediga jobb just nu"}
          </span>
          <Button variant={c.openJobs > 0 ? "primary" : "secondary"} size="sm" iconRight={<Icon name="arrow" size={12} stroke={2.2}/>}>
            {c.openJobs > 0 ? "Se jobb" : "Visa profil"}
          </Button>
        </div>
      </div>
    </div>
  </article>
);

/* ════════════════════════════════════════════════
   PAGE
════════════════════════════════════════════════ */
const Page = () => {
  const [nav, setNav] = useState("favoriter");
  const [tab, setTab] = useState("jobs");
  const [jobs, setJobs] = useState(FAV_JOBS);
  const [companies, setCompanies] = useState(FAV_COMPANIES);

  const tabs = [
    { k: "jobs",      l: "Sparade jobb",   c: jobs.length },
    { k: "companies", l: "Sparade åkerier", c: companies.length },
  ];

  return (
    <PageShell>
      <TopNav items={NAV_ITEMS} active={nav} onActive={setNav} currentUser={ME}/>

      {/* Header */}
      <div style={{ background: "var(--paper)", borderBottom: "1px solid var(--line)", paddingTop: 32, paddingBottom: 12 }}>
        <div style={{ maxWidth: 1040, margin: "0 auto", padding: "0 32px" }}>
          <p style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-500)", letterSpacing: 1.4, textTransform: "uppercase", marginBottom: 10 }}>För förare</p>
          <h1 style={{ fontSize: 38, fontWeight: 900, color: "var(--ink-900)", letterSpacing: -1.5, lineHeight: 1.15, marginBottom: 6 }}>Sparat</h1>
          <p style={{ fontSize: 14, color: "var(--ink-500)", fontWeight: 500, marginBottom: 24 }}>
            Jobb och åkerier du sparat för senare.
          </p>
          <div style={{ display: "flex", gap: 0, borderBottom: "1px solid var(--line)" }}>
            {tabs.map(t => {
              const isActive = tab === t.k;
              return (
                <button key={t.k} onClick={() => setTab(t.k)} style={{
                  padding: "12px 18px 14px", position: "relative",
                  fontSize: 14, fontWeight: isActive ? 700 : 500,
                  color: isActive ? "var(--ink-900)" : "var(--ink-500)",
                  display: "inline-flex", alignItems: "center", gap: 8,
                }}>
                  {t.l}
                  <span style={{ padding: "1px 8px", borderRadius: 999, background: isActive ? "var(--green-tint)" : "var(--paper-2)", color: isActive ? "var(--green-text)" : "var(--ink-500)", fontSize: 11, fontWeight: 800 }}>{t.c}</span>
                  {isActive && <span style={{ position: "absolute", left: 18, right: 18, bottom: -1, height: 3, background: "var(--green)", borderRadius: "3px 3px 0 0" }}/>}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      <main style={{ maxWidth: 1040, margin: "0 auto", padding: "24px 32px 80px" }}>
        <div className="stp-fade-up">
          {tab === "jobs" ? (
            jobs.length === 0 ? (
              <Card padding="56px 32px" style={{ textAlign: "center" }}>
                <h3 style={{ fontSize: 16, fontWeight: 700, color: "var(--ink-900)", marginBottom: 6 }}>Inga sparade jobb</h3>
                <p style={{ fontSize: 14, color: "var(--ink-500)", marginBottom: 18 }}>Tryck på hjärtat på ett jobb för att spara det här.</p>
                <Button variant="primary" size="sm">Sök lediga jobb</Button>
              </Card>
            ) : (
              <div className="fav-grid">
                {jobs.map(j => <JobCard key={j.id} job={j} onRemove={id => setJobs(js => js.filter(x => x.id !== id))}/>)}
              </div>
            )
          ) : (
            companies.length === 0 ? (
              <Card padding="56px 32px" style={{ textAlign: "center" }}>
                <h3 style={{ fontSize: 16, fontWeight: 700, color: "var(--ink-900)", marginBottom: 6 }}>Inga sparade åkerier</h3>
                <p style={{ fontSize: 14, color: "var(--ink-500)" }}>Spara åkerier för att följa deras lediga jobb.</p>
              </Card>
            ) : (
              <div className="fav-grid">
                {companies.map(c => <CompanyCard key={c.id} c={c} onRemove={id => setCompanies(cs => cs.filter(x => x.id !== id))}/>)}
              </div>
            )
          )}
        </div>
      </main>
    </PageShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
