<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Åkeriprofil (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const C = {
  name:"Nordic Transport AB", initials:"NT", loc:"Malmö, Skåne", rating:4.3, reviews:12, verified:true,
  employees:340, fleet:180, founded:1987,
  desc:"Ett av Sveriges ledande transportföretag med verksamhet i hela Norden. Bra chaufförer förtjänar bra arbetsvillkor, moderna fordon och respekt.",
  segments:["Fjärr","Tempererat","Bulk"],
  benefits:[["check","Kollektivavtal"],["truck","Nya Volvo FH 2024"],["star","Betald övernattning"],["heart","Friskvård 4 000 kr/år"]],
  jobs:[{title:"CE-chaufför fjärr",loc:"Malmö",match:94},{title:"CE-chaufför tempererat",loc:"Helsingborg",match:81}],
};
const Star = ({ r }) => <span style={{ display:"inline-flex", gap:1 }}>{[1,2,3,4,5].map(i => <Icon key={i} name="star" size={12} color={i<=Math.round(r)?"var(--amber)":"var(--ink-200)"} stroke={0}/>)}</span>;
const Back = () => <div style={{ background:"var(--paper)", padding:"4px 12px 8px" }}><button style={{ width:38, height:38, borderRadius:"50%", background:"var(--card)", border:"1px solid var(--line)", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"var(--sh-sm)" }}><Icon name="arrowLeft" size={18} color="var(--ink-900)" stroke={2}/></button></div>;

const App = () => {
  const [saved, setSaved] = useState(false);
  return (
    <MobileShell noTabs header={<Back/>} footer={
      <div style={{ background:"var(--card)", borderTop:"1px solid var(--line)", padding:"12px 16px 24px", display:"flex", gap:10 }}>
        <button onClick={() => setSaved(s=>!s)} style={{ width:50, borderRadius:12, background:saved?"var(--amber-tint)":"var(--card-2)", border:`1px solid ${saved?"rgba(199,122,14,0.3)":"var(--line-2)"}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name="heart" size={18} color={saved?"var(--amber-deep)":"var(--ink-500)"} stroke={saved?0:2}/></button>
        <Button variant="primary" size="lg" iconRight={<Icon name="arrow" size={15} stroke={2.2}/>} style={{ flex:1 }}>Se alla lediga jobb</Button>
      </div>
    }>
      <div style={{ padding:"4px 16px 24px", display:"flex", flexDirection:"column", gap:14 }}>
        {/* Hero */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:18, padding:"20px 18px", boxShadow:"var(--sh-sm)", textAlign:"center" }}>
          <div style={{ width:64, height:64, borderRadius:16, background:"var(--paper-2)", border:"1px solid var(--line-2)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:800, color:"var(--ink-700)", margin:"0 auto 12px" }}>{C.initials}</div>
          <div style={{ display:"flex", alignItems:"center", gap:7, justifyContent:"center", marginBottom:4 }}><h1 style={{ fontSize:20, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.5 }}>{C.name}</h1>{C.verified && <Pill tone="success" size="sm" icon={<Icon name="check" size={10} color="var(--success)" stroke={3}/>}>Verifierat</Pill>}</div>
          <div style={{ fontSize:13, color:"var(--ink-500)", display:"flex", alignItems:"center", gap:7, justifyContent:"center" }}><Star r={C.rating}/>{C.rating} ({C.reviews}) · {C.loc}</div>
        </div>

        {/* Stats */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:0, background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, overflow:"hidden", boxShadow:"var(--sh-sm)" }}>
          {[["2",`${C.jobs.length}`,"Lediga jobb"],["1",C.employees,"Anställda"],["0",C.founded,"Grundat"]].map(([_,v,l],i) => (
            <div key={l} style={{ padding:"14px 10px", textAlign:"center", borderRight:i<2?"1px solid var(--line)":"none" }}>
              <div style={{ fontSize:20, fontWeight:800, color:i===0?"var(--green)":"var(--ink-900)", fontFamily:"var(--mono)", lineHeight:1 }}>{v}</div>
              <div style={{ fontSize:10.5, color:"var(--ink-500)", marginTop:5, fontWeight:600, textTransform:"uppercase", letterSpacing:0.2 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* About */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:10 }}>Om åkeriet</div>
          <p style={{ fontSize:14, color:"var(--ink-700)", lineHeight:1.6, marginBottom:12 }}>{C.desc}</p>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{C.segments.map(s => <Pill key={s} tone="soft" size="sm">{s}</Pill>)}</div>
        </div>

        {/* Benefits */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:12 }}>Förmåner</div>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {C.benefits.map(([ic,t]) => <div key={t} style={{ display:"flex", gap:11, alignItems:"center" }}><span style={{ width:32, height:32, borderRadius:8, background:"var(--green-tint)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name={ic} size={15} color="var(--green-text)" stroke={2}/></span><span style={{ fontSize:14, color:"var(--ink-900)", fontWeight:600 }}>{t}</span></div>)}
          </div>
        </div>

        {/* Jobs */}
        <div style={{ background:"var(--card)", border:"1px solid var(--line)", borderRadius:14, padding:"16px", boxShadow:"var(--sh-sm)" }}>
          <div style={{ fontSize:11, fontWeight:800, letterSpacing:1.2, textTransform:"uppercase", color:"var(--ink-500)", marginBottom:12 }}>Lediga jobb</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {C.jobs.map(j => <div key={j.title} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 14px", background:"var(--card-2)", borderRadius:11 }}><div><div style={{ fontSize:14, fontWeight:700, color:"var(--ink-900)" }}>{j.title}</div><div style={{ fontSize:12, color:"var(--ink-500)" }}>{j.loc}</div></div><span style={{ fontSize:13, fontWeight:800, fontFamily:"var(--mono)", color:j.match>=85?"var(--success)":"var(--green)" }}>{j.match}%</span></div>)}
          </div>
        </div>
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
