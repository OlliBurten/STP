<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Åkeriportal</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>

<style>
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cols { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 1080px) { .cols { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-500); padding: 10px 14px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  .tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--ink-800); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--card-2); }
  .sel { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); font-family: var(--font); font-size: 13px; color: var(--ink-900); }
  .search { height: 36px; padding: 0 12px 0 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); font-family: var(--font); font-size: 13px; width: 240px; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(10,26,26,0.35); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100vw; background: var(--paper); z-index: 41; overflow-y: auto; box-shadow: var(--sh-md); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink-900); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; z-index: 60; box-shadow: var(--sh-md); }
  button { font-family: var(--font); background: none; border: none; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

/* ════════════════════════════════════════════════════════════
   Prototyp: STP Åkeriportal (okt 2026)
   Endast det STP gör för åkerier IDAG, i adminvyns format (mörk
   sidomeny). Inga nya funktioner — förarregister/behörigheter och
   HR är framtida separata produkter och visas inte här.
   All data är påhittad.
════════════════════════════════════════════════════════════ */

const TODAY = new Date("2026-10-07");
const daysUntil = (iso) => Math.round((new Date(iso) - TODAY) / 86400000);
const fmt = (iso) => new Date(iso).toLocaleDateString("sv-SE", { day: "numeric", month: "short", year: "numeric" });

const ORG = { name: "Smålands Godstrafik AB", initials: "SG" };
const ME = { name: "Erik Holm", initials: "EH", role: "Ägare" };
const TEAM = [
  { id: "eh", name: "Erik Holm", initials: "EH", role: "Ägare", email: "erik@smgodstrafik.se" },
  { id: "sl", name: "Sara Lind", initials: "SL", role: "Transportledare", email: "sara@smgodstrafik.se" },
  { id: "jb", name: "Johan Berg", initials: "JB", role: "Trafikchef", email: "johan@smgodstrafik.se" },
];
const teamById = Object.fromEntries(TEAM.map(t => [t.id, t]));

const JOBS = [
  { id: "j1", title: "CE-chaufför fjärrkörning", city: "Växjö", status: "Aktiv", days: 14, views: 312 },
  { id: "j2", title: "Distributionsförare C", city: "Göteborg", status: "Aktiv", days: 6, views: 148 },
  { id: "j3", title: "CE-chaufför natt", city: "Jönköping", status: "Aktiv", days: 21, views: 97 },
  { id: "j4", title: "Timmerbilsförare", city: "Värnamo", status: "Pausad", days: 40, views: 211 },
];
const jobById = Object.fromEntries(JOBS.map(j => [j.id, j]));

const STAGES = ["Ny", "Granskar", "Intervju", "Anställd", "Avslagen"];
const STAGE_TONE = { Ny: "amber", Granskar: "info", Intervju: "soft", Anställd: "success", Avslagen: "neutral" };

const CANDIDATES0 = [
  { id: "c1", name: "Ahmed Karimi", job: "j1", stage: "Ny", match: 92, last: "idag 08:12", lic: ["CE"], certs: ["YKB", "ADR"], years: 8, city: "Växjö", refs: [{ from: "Kustfrakt Syd AB", period: "2019–2024", again: true, scores: [5, 4, 5] }] },
  { id: "c2", name: "Linnea Ström", job: "j2", stage: "Ny", match: 78, last: "idag 07:40", lic: ["C"], certs: ["YKB"], years: 3, city: "Kungälv", refs: [] },
  { id: "c3", name: "Mikael Sundqvist", job: "j1", stage: "Granskar", match: 85, last: "igår", lic: ["CE"], certs: ["YKB"], years: 12, city: "Alvesta", refs: [{ from: "Norrlands Skogsfrakt", period: "2015–2021", again: false, scores: [3, 4, 2] }] },
  { id: "c4", name: "Jonas Ek", job: "j3", stage: "Intervju", match: 88, last: "igår", lic: ["CE"], certs: ["YKB"], years: 6, city: "Jönköping", refs: [] },
  { id: "c5", name: "Fatima Hassan", job: "j2", stage: "Granskar", match: 81, last: "2 dgr", lic: ["C", "CE"], certs: ["YKB"], years: 4, city: "Göteborg", refs: [] },
  { id: "c6", name: "Peter Nyberg", job: "j1", stage: "Intervju", match: 94, last: "2 dgr", lic: ["CE"], certs: ["YKB", "ADR"], years: 15, city: "Ljungby", refs: [{ from: "Express Distribution", period: "2018–2025", again: true, scores: [5, 5, 4] }] },
  { id: "c7", name: "Oskar Lund", job: "j3", stage: "Ny", match: 70, last: "3 dgr", lic: ["CE"], certs: [], years: 1, city: "Nässjö", refs: [] },
  { id: "c8", name: "Sofia Berg", job: "j2", stage: "Intervju", match: 83, last: "4 dgr", lic: ["C"], certs: ["YKB"], years: 5, city: "Mölndal", refs: [] },
  { id: "c9", name: "Daniel Holm", job: "j1", stage: "Avslagen", match: 61, last: "1 v", lic: ["C"], certs: [], years: 2, city: "Växjö", refs: [] },
  { id: "c10", name: "Ali Rahimi", job: "j1", stage: "Ny", match: 87, last: "idag 06:55", lic: ["CE"], certs: ["YKB"], years: 7, city: "Tingsryd", refs: [] },
];

/* ── Shell ─────────────────────────────────────────────────── */
const NAV = [
  { group: "Rekrytering", items: [
    { id: "overview", label: "Översikt", icon: "building" },
    { id: "candidates", label: "Kandidater", icon: "user" },
    { id: "jobs", label: "Annonser", icon: "truck" },
    { id: "messages", label: "Meddelanden", icon: "msg" },
    { id: "find", label: "Hitta förare", icon: "search" },
  ]},
  { group: "Åkeriet", items: [
    { id: "team", label: "Team", icon: "user" },
    { id: "settings", label: "Inställningar", icon: "settings" },
  ]},
];

const Shell = ({ active, onNav, badges, title, sub, action, children }) => (
  <div style={{ minHeight: "100vh", display: "grid", gridTemplateColumns: "232px 1fr", background: "var(--paper)" }}>
    <aside style={{ background: "var(--ink-900)", color: "rgba(255,255,255,0.7)", display: "flex", flexDirection: "column", position: "sticky", top: 0, height: "100vh" }}>
      <div style={{ padding: "18px 20px", borderBottom: "1px solid rgba(255,255,255,0.08)", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 28, height: 28, borderRadius: 7, background: "var(--green)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 12 }}>S</div>
        <span style={{ fontWeight: 800, fontSize: 15, color: "#fff", letterSpacing: 0.5 }}>STP</span>
        <span style={{ fontSize: 10, fontWeight: 800, color: "var(--amber)", letterSpacing: 1, textTransform: "uppercase", paddingLeft: 8, marginLeft: 2, borderLeft: "1px solid rgba(255,255,255,0.15)" }}>Åkeri</span>
      </div>
      <div style={{ padding: "14px 20px 4px", fontSize: 13, fontWeight: 700, color: "#fff", display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ORG.name}</span>
        <Icon name="check" size={13} color="var(--success)" stroke={2.6}/>
      </div>
      <nav style={{ flex: 1, overflowY: "auto", padding: "12px 12px" }}>
        {NAV.map(g => (
          <div key={g.group} style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 1.2, textTransform: "uppercase", color: "rgba(255,255,255,0.35)", padding: "0 10px 8px" }}>{g.group}</div>
            {g.items.map(it => {
              const on = active === it.id;
              const badge = badges[it.id];
              return (
                <button key={it.id} onClick={() => onNav(it.id)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, padding: "9px 10px", borderRadius: 8, marginBottom: 2, background: on ? "rgba(255,255,255,0.10)" : "transparent", color: on ? "#fff" : "rgba(255,255,255,0.65)", fontSize: 13.5, fontWeight: on ? 700 : 500, textAlign: "left" }}>
                  <Icon name={it.icon} size={16} color={on ? "var(--amber)" : "rgba(255,255,255,0.5)"} stroke={2}/>
                  <span style={{ flex: 1 }}>{it.label}</span>
                  {badge ? <span style={{ background: badge.tone === "danger" ? "var(--danger)" : "var(--amber)", color: "#fff", fontSize: 10, fontWeight: 800, padding: "1px 6px", borderRadius: 8 }}>{badge.n}</span> : null}
                </button>
              );
            })}
          </div>
        ))}
      </nav>
      <div style={{ padding: "14px 16px", borderTop: "1px solid rgba(255,255,255,0.08)", display: "flex", alignItems: "center", gap: 10 }}>
        <Avatar initials={ME.initials} size={30}/>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "#fff" }}>{ME.name}</div>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.45)" }}>{ME.role}</div>
        </div>
      </div>
    </aside>
    <div style={{ minWidth: 0, display: "flex", flexDirection: "column" }}>
      <header style={{ background: "var(--card)", borderBottom: "1px solid var(--line)", padding: "20px 32px", display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 16, flexWrap: "wrap", position: "sticky", top: 0, zIndex: 10 }}>
        <div>
          <h1 style={{ fontSize: 24, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.6 }}>{title}</h1>
          {sub && <p style={{ fontSize: 13.5, color: "var(--ink-500)", marginTop: 3 }}>{sub}</p>}
        </div>
        {action}
      </header>
      <main style={{ flex: 1, padding: "28px 32px 64px", maxWidth: 1240, width: "100%" }}>{children}</main>
    </div>
  </div>
);

/* ── Små byggstenar ────────────────────────────────────────── */
const Kpi = ({ label, value, sub, tone = "ink", onClick }) => {
  const c = { ink: "var(--ink-900)", amber: "var(--amber-deep)", danger: "var(--danger)", success: "var(--success)" }[tone];
  return (
    <button onClick={onClick} style={{ textAlign: "left", width: "100%" }}>
      <Card padding="18px 20px">
        <div style={{ fontSize: 12.5, color: "var(--ink-500)", fontWeight: 600, marginBottom: 10 }}>{label}</div>
        <div style={{ fontSize: 30, fontWeight: 800, color: c, letterSpacing: -1, fontFamily: "var(--mono)", lineHeight: 1, marginBottom: 8 }}>{value}</div>
        <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-500)" }}>{sub}</div>
      </Card>
    </button>
  );
};

const Drawer = ({ onClose, children }) => (
  <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer stp-fade-up">
      <div style={{ display: "flex", justifyContent: "flex-end", padding: "14px 16px 0" }}>
        <Button variant="ghost" size="sm" onClick={onClose} icon={<Icon name="x" size={14}/>}>Stäng</Button>
      </div>
      <div style={{ padding: "4px 26px 32px" }}>{children}</div>
    </div>
  </>
);

/* ── Översikt ──────────────────────────────────────────────── */
const Overview = ({ cands, go, openCand }) => {
  const newC = cands.filter(c => c.stage === "Ny");
  const queue = [
    ...newC.map(c => ({ key: c.id, tone: "new", title: `${c.name} sökte ${jobById[c.job].title} · ${c.match} %`, action: "Granska", onClick: () => openCand(c) })),
    { key: "m1", tone: "msg", title: "Sofia Berg väntar på svar om intervjutid", action: "Svara", onClick: () => go("messages") },
  ];
  const toneDot = { new: "amber", msg: "primary" };
  return (
    <>
      <div className="kpi-grid" style={{ marginBottom: 20 }}>
        <Kpi label="Nya ansökningar" value={newC.length} sub="att granska" tone="amber" onClick={() => go("candidates")}/>
        <Kpi label="Obesvarade meddelanden" value="1" sub="äldst 4 dgr" onClick={() => go("messages")}/>
        <Kpi label="Aktiva annonser" value={JOBS.filter(j => j.status === "Aktiv").length} sub={`${JOBS.reduce((s, j) => s + j.views, 0)} visningar totalt`} onClick={() => go("jobs")}/>
        <Kpi label="Profilvisningar" value="23" sub="senaste 7 dagarna"/>
      </div>
      <div className="cols">
        <Card padding="20px 22px">
          <SectionLabel>Att göra</SectionLabel>
          {queue.map((q, i) => (
            <div key={q.key} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderTop: i ? "1px solid var(--line)" : "none" }}>
              <Dot tone={toneDot[q.tone]} size={8}/>
              <span style={{ flex: 1, fontSize: 14, color: "var(--ink-800)" }}>{q.title}</span>
              <Button size="sm" variant="secondary" onClick={q.onClick}>{q.action}</Button>
            </div>
          ))}
        </Card>
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <Card padding="20px 22px">
            <SectionLabel accessory={<Button variant="link" size="sm" onClick={() => go("candidates")}>Alla</Button>}>Pipeline</SectionLabel>
            {STAGES.filter(s => s !== "Avslagen").map(s => {
              const n = cands.filter(c => c.stage === s).length;
              return (
                <div key={s} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <span style={{ width: 86, fontSize: 13, color: "var(--ink-700)" }}>{s}</span>
                  <div style={{ flex: 1, height: 8, borderRadius: 4, background: "var(--paper-2)" }}>
                    <div style={{ width: `${Math.min(100, n * 18)}%`, height: "100%", borderRadius: 4, background: "var(--green)" }}/>
                  </div>
                  <span style={{ width: 20, textAlign: "right", fontFamily: "var(--mono)", fontSize: 13, fontWeight: 700 }}>{n}</span>
                </div>
              );
            })}
          </Card>
          <Card padding="20px 22px">
            <SectionLabel accessory={<Button variant="link" size="sm" onClick={() => go("jobs")}>Alla</Button>}>Annonser</SectionLabel>
            {JOBS.filter(j => j.status === "Aktiv").map(j => (
              <div key={j.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", fontSize: 13.5 }}>
                <span style={{ color: "var(--ink-800)" }}>{j.title} · {j.city}</span>
                <span style={{ fontFamily: "var(--mono)", color: "var(--ink-500)" }}>{cands.filter(c => c.job === j.id).length} sökande</span>
              </div>
            ))}
          </Card>
        </div>
      </div>
    </>
  );
};

/* ── Kandidater ────────────────────────────────────────────── */
const Candidates = ({ cands, openCand }) => {
  const [q, setQ] = useState("");
  const [job, setJob] = useState("");
  const [stage, setStage] = useState("");
  const list = cands.filter(c =>
    (!q || c.name.toLowerCase().includes(q.toLowerCase())) &&
    (!job || c.job === job) && (!stage || c.stage === stage));
  return (
    <Card padding="0">
      <div style={{ display: "flex", gap: 10, padding: "16px 18px", flexWrap: "wrap", alignItems: "center", borderBottom: "1px solid var(--line)" }}>
        <div style={{ position: "relative" }}>
          <Icon name="search" size={14} color="var(--ink-400)" style={{ position: "absolute", left: 11, top: 11 }}/>
          <input className="search" placeholder="Sök kandidat" value={q} onChange={e => setQ(e.target.value)}/>
        </div>
        <select className="sel" value={job} onChange={e => setJob(e.target.value)}>
          <option value="">Alla annonser</option>
          {JOBS.map(j => <option key={j.id} value={j.id}>{j.title} · {j.city}</option>)}
        </select>
        <select className="sel" value={stage} onChange={e => setStage(e.target.value)}>
          <option value="">Alla steg</option>
          {STAGES.map(s => <option key={s}>{s}</option>)}
        </select>
        <span style={{ marginLeft: "auto", fontSize: 13, color: "var(--ink-500)" }}>{list.length} kandidater</span>
      </div>
      <table className="tbl">
        <thead><tr><th>Kandidat</th><th>Annons</th><th>Steg</th><th>Matchning</th><th>Senast</th></tr></thead>
        <tbody>
          {list.map(c => (
            <tr key={c.id} className="click" onClick={() => openCand(c)}>
              <td>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <Avatar initials={c.name.split(" ").map(w => w[0]).join("")} size={30} color="var(--green-soft)"/>
                  <div>
                    <div style={{ fontWeight: 700, color: "var(--ink-900)" }}>{c.name}</div>
                    <div style={{ fontSize: 12, color: "var(--ink-500)" }}>{c.city} · {c.lic.join("/")} · {c.years} år{c.refs.length ? " · referens" : ""}</div>
                  </div>
                </div>
              </td>
              <td>{jobById[c.job].title}<div style={{ fontSize: 12, color: "var(--ink-500)" }}>{jobById[c.job].city}</div></td>
              <td><Pill size="sm" tone={STAGE_TONE[c.stage]}>{c.stage}</Pill></td>
              <td style={{ fontFamily: "var(--mono)", fontWeight: 700, color: c.match >= 85 ? "var(--success)" : "var(--ink-700)" }}>{c.match} %</td>
              <td style={{ color: "var(--ink-500)" }}>{c.last}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </Card>
  );
};

const CandidateDrawer = ({ c, onClose, update }) => (
  <Drawer onClose={onClose}>
    <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 6 }}>
      <Avatar initials={c.name.split(" ").map(w => w[0]).join("")} size={52} color="var(--green-soft)"/>
      <div>
        <h2 style={{ fontSize: 21, fontWeight: 800, color: "var(--ink-900)" }}>{c.name}</h2>
        <div style={{ fontSize: 13.5, color: "var(--ink-500)" }}>{c.city} · sökte {jobById[c.job].title}</div>
      </div>
    </div>
    <div style={{ display: "flex", gap: 8, margin: "14px 0 20px", flexWrap: "wrap" }}>
      <Pill tone="success">{c.match} % matchning</Pill>
      {c.lic.map(l => <Pill key={l} tone="outline">{l}</Pill>)}
      {c.certs.map(x => <Pill key={x} tone="outline">{x}</Pill>)}
      <Pill tone="neutral">{c.years} års erfarenhet</Pill>
    </div>

    <label style={{ display: "block", fontSize: 12, fontWeight: 700, color: "var(--ink-500)", marginBottom: 20, maxWidth: 220 }}>Steg
      <select className="sel" style={{ width: "100%", marginTop: 6 }} value={c.stage} onChange={e => update(c.id, { stage: e.target.value })}>
        {STAGES.map(s => <option key={s}>{s}</option>)}
      </select>
    </label>

    <div style={{ display: "flex", gap: 8, marginBottom: 26 }}>
      <Button size="md" icon={<Icon name="msg" size={14} stroke={2}/>}>Skicka meddelande</Button>
      <Button size="md" variant="secondary" icon={<Icon name="user" size={14} stroke={2}/>}>Visa profil</Button>
    </div>

    <SectionLabel>Referenser från åkerier</SectionLabel>
    {c.refs.length === 0 && <p style={{ fontSize: 13.5, color: "var(--ink-400)", marginBottom: 20 }}>Inga referenser ännu.</p>}
    {c.refs.map((r, i) => (
      <Card key={i} padding="14px 16px" style={{ marginBottom: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 13.5 }}>{r.from}</div>
            <div style={{ fontSize: 12, color: "var(--ink-500)" }}>{r.period}</div>
          </div>
          <span><Pill size="sm" tone={r.again ? "success" : "danger"}>{r.again ? "Skulle anställa igen" : "Skulle inte anställa igen"}</Pill></span>
        </div>
        {["Passar tider", "Tar hand om fordonet", "Samarbete"].map((l, k) => (
          <div key={l} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--ink-700)", padding: "2px 0" }}>
            {l}<span style={{ display: "inline-flex", gap: 3 }}>{[1, 2, 3, 4, 5].map(n => <span key={n} style={{ width: 8, height: 8, borderRadius: 8, background: n <= r.scores[k] ? "var(--green)" : "var(--line-2)" }}/>)}</span>
          </div>
        ))}
      </Card>
    ))}
    <Button variant="link" size="sm">Lämna referens</Button>
  </Drawer>
);

/* ── Annonser / Meddelanden / Hitta förare / Team / Inställningar ── */
const Jobs = ({ cands }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    {JOBS.map(j => {
      const cs = cands.filter(c => c.job === j.id);
      return (
        <Card key={j.id} padding="18px 22px">
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>

/* ── App ───────────────────────────────────────────────────── */
const TITLES = {
  overview: ["Översikt", "Det som behöver göras idag"],
  candidates: ["Kandidater", "Alla sökande till alla annonser"],
  jobs: ["Annonser", null],
  messages: ["Meddelanden", null],
  find: ["Hitta förare", "Förare som är synliga för åkerier"],
  team: ["Team", null],
  settings: ["Inställningar", null],
};

const App = () => {
  const [nav, setNav] = useState("overview");
  const [cands, setCands] = useState(CANDIDATES0);
  const [openC, setOpenC] = useState(null);

  const update = (id, patch) => {
    setCands(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
    setOpenC(c => c && c.id === id ? { ...c, ...patch } : c);
  };

  const newCount = cands.filter(c => c.stage === "Ny").length;
  const badges = {
    candidates: newCount ? { n: newCount } : null,
    messages: { n: 1 },
  };
  const action = {
    overview: <Button icon={<Icon name="plus" size={14} stroke={2.4}/>} onClick={() => setNav("jobs")}>Publicera annons</Button>,
    jobs: <Button icon={<Icon name="plus" size={14} stroke={2.4}/>}>Publicera annons</Button>,
  }[nav];

  const [title, sub] = TITLES[nav];
  return (
    <>
      <Shell active={nav} onNav={setNav} badges={badges} title={title} sub={sub} action={action}>
        {nav === "overview" && <Overview cands={cands} go={setNav} openCand={setOpenC}/>}
        {nav === "candidates" && <Candidates cands={cands} openCand={setOpenC}/>}
        {nav === "jobs" && <Jobs cands={cands}/>}
        {nav === "messages" && <Messages/>}
        {nav === "find" && <Find/>}
        {nav === "team" && <Team/>}
        {nav === "settings" && <Settings/>}
      </Shell>
      {openC && <CandidateDrawer c={openC} onClose={() => setOpenC(null)} update={update}/>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
