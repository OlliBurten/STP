<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Kom igång (mobil)</title>
<link rel="stylesheet" href="stp-light-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const STEPS = ["Vad söker du?", "Körkort", "Region"];
const LICENSES = ["B","C1","C1E","C","CE","D"];
const REGIONS = ["Skåne","Stockholm","V. Götaland","Halland","Uppsala","Norrbotten"];

const App = () => {
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(false);
  const [seg, setSeg] = useState("");
  const [lic, setLic] = useState([]);
  const [region, setRegion] = useState("");
  const [name, setName] = useState("");
  const toggle = v => setLic(l => l.includes(v) ? l.filter(x=>x!==v) : [...l, v]);
  const canNext = step===0 ? !!seg : step===1 ? lic.length>0 : (!!region && name.trim().length>0);

  if (done) return (
    <MobileShell noTabs>
      <div style={{ padding:"50px 24px", textAlign:"center", display:"flex", flexDirection:"column", alignItems:"center" }}>
        <div style={{ width:76, height:76, borderRadius:38, background:"var(--success-tint)", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:22 }}><Icon name="check" size={34} color="var(--success)" stroke={3}/></div>
        <h1 style={{ fontSize:24, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:10 }}>Din profil är klar!</h1>
        <p style={{ fontSize:14.5, color:"var(--ink-500)", lineHeight:1.6, marginBottom:28 }}>Du är nu synlig för åkerier i {region}. Åkerier kan hitta dig och höra av sig direkt.</p>
        <Button variant="primary" size="lg" full iconRight={<Icon name="arrow" size={15} stroke={2.2}/>}>Till lediga jobb</Button>
      </div>
    </MobileShell>
  );

  return (
    <MobileShell noTabs footer={
      <div style={{ background:"var(--card)", borderTop:"1px solid var(--line)", padding:"12px 16px 24px", display:"flex", gap:10 }}>
        {step > 0 && <Button variant="secondary" size="lg" onClick={() => setStep(step-1)} icon={<Icon name="arrowLeft" size={14} stroke={2}/>}>Bakåt</Button>}
        <Button variant="primary" size="lg" onClick={() => step<STEPS.length-1 ? setStep(step+1) : setDone(true)} disabled={!canNext} iconRight={<Icon name="arrow" size={15} stroke={2.2}/>} style={{ flex:1 }}>{step<STEPS.length-1?"Fortsätt":"Skapa profil"}</Button>
      </div>
    }>
      <div style={{ padding:"12px 20px 24px" }}>
        <div style={{ display:"flex", gap:6, marginBottom:8 }}>{STEPS.map((s,i) => <div key={i} style={{ height:4, flex:1, borderRadius:2, background:i<=step?"var(--green)":"var(--line-2)" }}/>)}</div>
        <div style={{ fontSize:12.5, color:"var(--ink-500)", fontWeight:600, marginBottom:28 }}>Steg {step+1} av {STEPS.length}</div>

        {step===0 && (<div>
          <h1 style={{ fontSize:24, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:8 }}>Vad söker du?</h1>
          <p style={{ fontSize:14, color:"var(--ink-500)", marginBottom:24 }}>Så matchar vi dig rätt.</p>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {[["fulltime","building","Fast heltid","Trygghet, kollektivavtal"],["flex","cal","Vikarie / Extra","Vikariat, deltid, extrapass"],["intern","star","Praktik","Elever och nybörjare"]].map(([v,ic,l,d]) => (
              <button key={v} onClick={() => setSeg(v)} style={{ display:"flex", gap:14, alignItems:"center", padding:"16px", borderRadius:14, textAlign:"left", background:seg===v?"var(--green-tint)":"var(--card)", border:`1.5px solid ${seg===v?"var(--green)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}>
                <span style={{ width:44, height:44, borderRadius:11, background:seg===v?"var(--green)":"var(--green-tint)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><Icon name={ic} size={20} color={seg===v?"#fff":"var(--green-text)"} stroke={2}/></span>
                <div style={{ flex:1 }}><div style={{ fontSize:15.5, fontWeight:700, color:"var(--ink-900)" }}>{l}</div><div style={{ fontSize:12.5, color:"var(--ink-500)", marginTop:2 }}>{d}</div></div>
                {seg===v && <Icon name="check" size={18} color="var(--green)" stroke={3}/>}
              </button>
            ))}
          </div>
        </div>)}

        {step===1 && (<div>
          <h1 style={{ fontSize:24, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:8 }}>Vilka körkort?</h1>
          <p style={{ fontSize:14, color:"var(--ink-500)", marginBottom:24 }}>Det viktigaste för matchningen.</p>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {LICENSES.map(l => { const sel=lic.includes(l); return <button key={l} onClick={() => toggle(l)} style={{ padding:"18px", borderRadius:12, fontSize:18, fontWeight:800, background:sel?"var(--green)":"var(--card)", color:sel?"#fff":"var(--ink-900)", border:`1.5px solid ${sel?"var(--green-deep)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}>{l}</button>; })}
          </div>
        </div>)}

        {step===2 && (<div>
          <h1 style={{ fontSize:24, fontWeight:800, color:"var(--ink-900)", letterSpacing:-0.6, marginBottom:8 }}>Vem och var?</h1>
          <p style={{ fontSize:14, color:"var(--ink-500)", marginBottom:24 }}>Så åkerier vet vem de pratar med.</p>
          <div style={{ fontSize:13, fontWeight:700, color:"var(--ink-700)", marginBottom:8 }}>Ditt namn</div>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="För- och efternamn" style={{ width:"100%", padding:"13px 16px", borderRadius:12, background:"var(--card)", border:"1px solid var(--line-2)", fontSize:15, color:"var(--ink-900)", outline:"none", fontFamily:"var(--font)", boxShadow:"var(--sh-sm)", marginBottom:24 }}/>
          <div style={{ fontSize:13, fontWeight:700, color:"var(--ink-700)", marginBottom:10 }}>Din region</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>{REGIONS.map(r => <button key={r} onClick={() => setRegion(r)} style={{ padding:"9px 15px", borderRadius:999, fontSize:13.5, fontWeight:600, background:region===r?"var(--green)":"var(--card)", color:region===r?"#fff":"var(--ink-700)", border:`1px solid ${region===r?"var(--green-deep)":"var(--line-2)"}`, boxShadow:"var(--sh-sm)" }}>{r}</button>)}</div>
        </div>)}
      </div>
    </MobileShell>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
