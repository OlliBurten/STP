<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STP – Profil (mobil)</title>

<link rel="stylesheet" href="stp-light-tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="stp-light-components.jsx"></script>
<script type="text/babel" src="stp-mobile-shell.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const D = {
  name: "Oliver Harburt", initials: "OH", location: "Malmö", region: "Skåne", yearsExp: 11,
  licenses: ["CE", "C", "B"],
  certs: [
    { id: "YKB", status: "expired", detail: "Utgånget" },
    { id: "ADR", status: "valid", detail: "T.o.m. 2027-03" },
    { id: "Truck B", status: "expiring", detail: "6 mån kvar" },
  ],
  experience: [
    { role: "Fjärrförare", company: "Nordfrakt AB", years: "2021 – nu" },
    { role: "Distributionsförare", company: "Skåne Logistik AB", years: "2017 – 2021" },
    { role: "Chaufför", company: "Malmö Åkeri", years: "2014 – 2017" },
  ],
  reviews: [
    { author: "Nordfrakt AB", rating: 5, text: "En av våra mest pålitliga förare. Aldrig en missad leverans." },
    { author: "Skåne Logistik AB", rating: 5, text: "Lugn, punktlig och omtänksam med fordonet." },
  ],
  strength: 100,
};

const StarRow = ({ rating, size = 12 }) => (
  <span style={{ display: "inline-flex", gap: 1 }}>
    {[1,2,3,4,5].map(i => <Icon key={i} name="star" size={size} color={i <= rating ? "var(--amber)" : "var(--ink-200)"} stroke={0}/>)}
  </span>
);

const Section = ({ title, accessory, children }) => (
  <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: "18px 18px", boxShadow: "var(--sh-sm)" }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
      <h2 style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.2, textTransform: "uppercase", color: "var(--ink-500)" }}>{title}</h2>
      {accessory}
    </div>
    {children}
  </div>
);

const App = () => {
  const [tab, setTab] = useState("profil");
  const certColor = { valid: "success", expiring: "amber", expired: "danger" };
  const avgReview = (D.reviews.reduce((s, r) => s + r.rating, 0) / D.reviews.length).toFixed(1);

  return (
    <MobileShell tabs={DRIVER_TABS} active={tab} onTab={setTab}>
      <div style={{ padding: "8px 16px 28px", display: "flex", flexDirection: "column", gap: 14 }}>
        {/* Hero */}
        <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 18, padding: "22px 18px", boxShadow: "var(--sh-sm)", textAlign: "center" }}>
          <div style={{ position: "relative", width: 92, margin: "0 auto 14px" }}>
            <div style={{ padding: 3, borderRadius: "50%", background: "conic-gradient(var(--success), var(--green-soft), var(--success))" }}>
              <div style={{ padding: 2, borderRadius: "50%", background: "var(--card)" }}>
                <Avatar initials={D.initials} size={80}/>
              </div>
            </div>
            <span style={{ position: "absolute", bottom: -2, left: "50%", transform: "translateX(-50%)", background: "var(--success)", color: "#fff", fontSize: 9.5, fontWeight: 800, letterSpacing: 0.3, padding: "2px 10px", borderRadius: 999, whiteSpace: "nowrap", border: "2px solid var(--card)" }}>SÖKER JOBB</span>
          </div>
          <h1 style={{ fontSize: 22, fontWeight: 800, color: "var(--ink-900)", letterSpacing: -0.5, marginBottom: 4 }}>{D.name}</h1>
          <div style={{ fontSize: 13.5, color: "var(--ink-500)", marginBottom: 14 }}>{D.location}, {D.region} · {D.yearsExp} års erfarenhet</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", marginBottom: 16 }}>
            {D.licenses.map(l => <Pill key={l} tone="primary">{l}</Pill>)}
            <Pill tone="danger" icon={<Dot tone="danger" size={5}/>}>YKB utgånget</Pill>
          </div>
          <Button variant="primary" size="md" full icon={<Icon name="edit" size={14} stroke={2}/>}>Redigera profil</Button>
        </div>

        {/* Profile strength */}
        <Section title="Profilstyrka" accessory={<span style={{ fontSize: 18, fontWeight: 800, color: "var(--green)", fontFamily: "var(--mono)" }}>{D.strength}<span style={{ fontSize: 12, color: "var(--ink-500)" }}>/100</span></span>}>
          <div style={{ height: 6, borderRadius: 3, background: "var(--paper-2)", overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${D.strength}%`, background: "linear-gradient(to right, var(--green), var(--green-soft))", borderRadius: 3 }}/>
          </div>
        </Section>

        {/* Certs */}
        <Section title="Körkort & certifikat">
          <div style={{ display: "flex", gap: 7, marginBottom: 14 }}>
            {["B","C1","C1E","C","CE"].map(l => {
              const owned = D.licenses.includes(l);
              return <div key={l} style={{ flex: 1, height: 44, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", background: owned ? "var(--green)" : "transparent", border: owned ? "1px solid var(--green-deep)" : "1px dashed var(--line-2)", color: owned ? "#fff" : "var(--ink-300)", fontWeight: 800, fontSize: 13 }}>{l}</div>;
            })}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
            {D.certs.map(c => (
              <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", background: c.status === "expired" ? "var(--danger-tint)" : c.status === "expiring" ? "var(--amber-tint)" : "var(--card-2)", borderRadius: 10 }}>
                <span style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 14, fontWeight: 700, color: "var(--ink-900)" }}><Dot tone={certColor[c.status]} size={7}/>{c.id}</span>
                <span style={{ fontSize: 12.5, color: c.status === "expired" ? "var(--danger)" : "var(--ink-500)", fontWeight: c.status === "expired" ? 700 : 500 }}>{c.detail}</span>
              </div>
            ))}
          </div>
        </Section>

        {/* Reviews */}
        <Section title="Omdömen från åkerier" accessory={<span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><StarRow rating={Math.round(avgReview)}/><span style={{ fontSize: 12.5, fontWeight: 700, color: "var(--ink-900)" }}>{avgReview}</span></span>}>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {D.reviews.map((r, i) => (
              <div key={i} style={{ padding: "12px 14px", background: "var(--card-2)", borderRadius: 11 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-900)", display: "inline-flex", alignItems: "center", gap: 5 }}>{r.author}<Icon name="check" size={10} color="var(--success)" stroke={3}/></span>
                  <StarRow rating={r.rating} size={11}/>
                </div>
                <p style={{ fontSize: 13, color: "var(--ink-700)", lineHeight: 1.5 }}>{r.text}</p>
              </div>
            ))}
          </div>
        </Section>

        {/* Experience */}
        <Section title="Erfarenhet">
          <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
            {D.experience.map((e, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 0", borderBottom: i < D.experience.length - 1 ? "1px solid var(--line)" : "none" }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "var(--ink-900)" }}>{e.role}</div>
                  <div style={{ fontSize: 12.5, color: "var(--ink-500)", marginTop: 1 }}>{e.company}</div>
                </div>
                <span style={{ fontSize: 12, color: "var(--ink-500)", fontFamily: "var(--mono)", whiteSpace: "nowrap" }}>{e.years}</span>
              </div>
            ))}
          </div>
        </Section>
      </div>
    </MobileShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
